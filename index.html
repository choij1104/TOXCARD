    rows.push({expr:full.replace(/\s+/g," "),out:shown+(rate?rate.replace(/\s+/g,""):""),capped,capTxt});
  }
  return rows.length?rows:null;
}
function calcHTML(dose){
  const rows=computeDoses(dose); if(!rows) return "";
  return `<div class="calc"><div class="hd">Computed at ${WT} kg${HT?" · "+tidy(bsa())+" m²":""}</div><ul>`
   + rows.map(r=>r.out===null?`<li>${esc(r.expr)} — <span class="cap">${esc(r.note)}</span></li>`
       :`<li>${esc(r.expr)} → <b>${esc(r.out)}</b>${r.capped?` <span class="cap">· capped at the stated maximum of ${esc(r.capTxt)}</span>`:""}</li>`).join("")
   + `</ul><div class="warn">Arithmetic on the line above, nothing more. It does not know the indication, does not choose between conditional regimens written for different weight bands, and cannot apply a ceiling that is not stated in the same clause. Read the dose block and verify before administration.</div></div>`;
}

/* ---------- routing ---------- */
let tab="home", stack=[], q="", cat="All", agentQ="", openTox=null;

function go(t){ tab=t; stack=[]; paint(); }
function push(kind,id){ stack.push({kind,id}); if(kind==="toxin") remember(id); paint(); }
function pop(){ stack.pop(); paint(); }
function remember(id){ recent=[id,...recent.filter(x=>x!==id)].slice(0,8); store.set("recent",recent); }

document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.tab)));
$("back").addEventListener("click",pop);
$("theme").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
  document.documentElement.setAttribute("data-theme",cur); store.set("theme",cur);
});
if(store.get("theme")==="light") document.documentElement.setAttribute("data-theme","light");

/* ---------- search ---------- */
const hay=t=>{const p=P[t.id]||{};return [t.name,(t.aka||[]).join(" "),t.category,p.agentLine,p.dose,p.pitfall,p.window,
  (p.antidoteIds||[]).map(i=>A[i]?A[i].name+" "+A[i].brands.join(" "):"").join(" ")].join(" ").toLowerCase();};
const search=s=>{const k=s.trim().toLowerCase(); return k?TOXINS.filter(t=>hay(t).includes(k)):[];};

/* ---------- render helpers ---------- */
const tierCol={A:"var(--tA)",B:"var(--tB)",C:"var(--tC)",D:"var(--tD)",N:"var(--tN)"};
function toxRow(t){
  const p=P[t.id]||{};
  return `<button class="row-item" data-tox="${t.id}">
    <span class="tier" style="background:${tierCol[p.tier]||"var(--tN)"}">${p.tier==="N"?"–":p.tier}</span>
    <span class="txt"><b>${esc(t.name)}</b><span>${esc(p.agentLine||t.category)}</span></span>
    <span class="car">›</span></button>`;
}
function agentRow(a){
  return `<button class="row-item" data-agent="${a.id}">
    <span class="tier" style="background:var(--teal)">⚕</span>
    <span class="txt"><b>${esc(a.name)}</b><span>${a.treats.length} toxin${a.treats.length>1?"s":""} · ${esc(a.class)}</span></span>
    <span class="car">›</span></button>`;
}
function wire(root){
  root.querySelectorAll("[data-tox]").forEach(b=>b.addEventListener("click",()=>push("toxin",b.dataset.tox)));
  root.querySelectorAll("[data-agent]").forEach(b=>b.addEventListener("click",()=>push("agent",b.dataset.agent)));
}

/* ---------- views ---------- */
function viewHome(){
  const alerts=(VERSION.changelog||[]).slice(0,2).map(c=>
    `<div class="alert"><span class="tag">Update · ${esc(VERSION.version)}</span>${esc(c)}</div>`).join("");
  const rec=recent.filter(id=>T[id]).slice(0,4).map(id=>toxRow(T[id])).join("");
  return `
  <div class="search"><span class="mag">⌕</span><input id="hq" type="search" placeholder="Search toxins, antidotes, brands…" value="${esc(q)}" autocomplete="off"></div>
  <div id="hres"></div>
  <div id="hbody">
    <div class="lbl">Quick access</div>
    <div class="tiles">
      <button class="tile" data-go="toxins"><span class="ic">☣</span><b>Toxin browser</b><span>${TOXINS.length} entries, ${new Set(TOXINS.map(t=>t.category)).size} categories</span></button>
      <button class="tile" data-go="agents"><span class="ic">⚕</span><b>Antidote browser</b><span>${AGENTS.length} agents and what each treats</span></button>
      <button class="tile" data-go="tools"><span class="ic">⚖</span><b>Dose calculator</b><span>Weight-based resolution</span></button>
    </div>
    <div class="tiles two" style="margin-top:9px">
      <button class="tile" data-go="tools"><span class="ic">◎</span><div><b>Toxidrome triage</b><br><span>No history? Start here</span></div></button>
      <button class="tile" data-tox="039-cyanide-smoke-inhalation-hcn-nitroprusside-acetonitrile-apri"><span class="ic">⚠</span><div><b>Cyanide</b><br><span>Hydroxocobalamin first line</span></div></button>
    </div>
    ${rec?`<div class="lbl">Recently viewed</div>${rec}`:""}
    <div class="lbl">Updates</div>${alerts}
    <div class="foot">
      Data ${esc(VERSION.version)} · reviewed ${esc(VERSION.lastReviewed)} · supply watch due ${esc(VERSION.supplyWatchDue||"—")}<br>
      US Poison Control <b class="mono">1-800-222-1222</b><br><br>
      Decision support for trained clinicians. Not a protocol and not a substitute for a regional poison center.<br>
      © 2026 Jae Hyek Choi, MSc, PhD, DVSc
    </div>
  </div>`;
}

function viewToxins(){
  const cats=["All",...[...new Set(TOXINS.map(t=>t.category))].sort()];
  const list=TOXINS.filter(t=>cat==="All"||t.category===cat);
  const groups={}; list.forEach(t=>(groups[t.category]??=[]).push(t));
  const body=Object.keys(groups).sort().map(c=>
    `<div class="lbl">${esc(c)} · ${groups[c].length}</div>`+groups[c].map(toxRow).join("")).join("");
  return `<div class="chips">${cats.map(c=>
    `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join("")}</div>${body}`;
}

function viewAgents(){
  const list=AGENTS.filter(a=>!agentQ||(a.name+" "+a.brands.join(" ")+" "+a.class).toLowerCase().includes(agentQ.toLowerCase()))
    .sort((x,y)=>y.treats.length-x.treats.length||x.name.localeCompare(y.name));
  return `<div class="search"><span class="mag">⌕</span><input id="aq" type="search" placeholder="Agent or brand name…" value="${esc(agentQ)}" autocomplete="off"></div>
    ${list.length?list.map(agentRow).join(""):'<p class="empty">No agent matches that.</p>'}`;
}

function viewTools(){
  return `
  <div class="lbl">Patient weight</div>
  <div class="card">
    <div class="wt">
      <label for="wt">kg</label><input id="wt" type="number" inputmode="decimal" min="0.5" max="300" step="0.5" value="${WT??""}">
      <label for="ht">cm</label><input id="ht" type="number" inputmode="decimal" min="30" max="230" step="1" value="${HT??""}">
      <button class="chip" id="wtclear">Clear</button>
    </div>
    <div class="hint" id="wthint"></div>
  </div>
  <div class="lbl">Toxidrome triage</div>
  <div class="card">
    <p style="color:var(--mut);font-size:13.5px;margin-bottom:11px">For the patient who arrives with no history. Each pattern states the finding that separates it from the one it is confused with.</p>
    <div class="txgrid">${TOXIDROMES.map(t=>`<button data-txd="${t.id}" aria-pressed="${openTox===t.id}">${esc(t.name)}</button>`).join("")}</div>
    <div id="txout"></div>
  </div>`;
}

function txDetail(t){
  return `<div style="margin-top:15px;padding-top:14px;border-top:1px solid var(--line)">
    <h3 style="margin:0 0 3px;font-size:17px">${esc(t.name)}</h3>
    <p class="mono" style="margin:0 0 11px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)">Onset — ${esc(t.onset)}</p>
    <dl class="kv"><dt>Pupils</dt><dd>${esc(t.pupils)}</dd><dt>Skin</dt><dd>${esc(t.skin)}</dd>
      <dt>Vitals</dt><dd>${esc(t.vitals)}</dd><dt>Mental</dt><dd>${esc(t.mental)}</dd></dl>
    <div class="card pit" style="margin-top:12px"><h4>Discriminator</h4><p>${esc(t.tell)}</p></div>
    <p class="srcline"><span class="st">Consider</span>${esc(t.agents.join(" · "))}</p>
    <button class="chip" id="txgo" style="margin-top:9px;border-color:var(--teal);color:var(--teal)">Show matching entries</button>
  </div>`;
}

function viewFavs(){
  const list=favs.filter(id=>T[id]);
  return list.length?list.map(id=>toxRow(T[id])).join("")
    :'<p class="empty">Nothing saved yet. Open an entry and tap the star to keep it here.</p>';
}

/* The badge must never contradict the tier. Four honest states:
   a linked agent with a tier   -> an antidote exists and is obtainable;
   a tier but nothing linked    -> tier D: investigational, contested, or unobtainable;
   tier N with agents linked    -> adjuncts, not an antidote;
   tier N with nothing linked   -> supportive care is the treatment. */
function antidoteBadge(p){
  const has=(p.antidoteIds||[]).length>0;
  if(p.tier==="D") return '<span class="badge amber">Investigational or not obtainable</span>';
  if(p.tier!=="N") return has
    ? '<span class="badge teal">Antidote available</span>'
    : '<span class="badge amber">No obtainable antidote</span>';
  return has
    ? '<span class="badge amber">No specific antidote · adjuncts only</span>'
    : '<span class="badge sig">Supportive care only</span>';
}

function viewToxin(id){
  const t=T[id], p=P[id]||{};
  const links=(p.antidoteIds||[]).map(a=>A[a]?`<button data-agent="${a}">${esc(A[a].name)} ›</button>`:"").join("");
  const src=(p.sources||[]).map(s=>`<div><span class="st">${esc(s.type)}</span>${esc(s.label)}</div>`).join("");
  return `
  <div class="hero">
    <div class="glyph" style="background:color-mix(in srgb,var(--sig) 20%,var(--surf));color:var(--sig)">☣</div>
    <div><h3>${esc(t.name)}</h3><div class="badges">
      <span class="badge">${esc(t.category)}</span>
      <span class="badge" style="color:${tierCol[p.tier]};border-color:${tierCol[p.tier]}">Tier ${p.tier==="N"?"—":p.tier}</span>
      ${antidoteBadge(p)}
    </div></div>
  </div>
  ${p.window?`<div class="card win"><h4>Time-critical window</h4><p>${esc(p.window)}</p></div>`:""}
  <div class="card"><h4>Agent</h4><p style="color:var(--teal);font-weight:600">${esc(p.agentLine)}</p></div>
  <div class="card"><h4>Dose and management</h4><p class="dose">${esc(p.dose)}</p>${calcHTML(p.dose)}</div>
  <div class="card pit"><h4>Pitfall</h4><p>${esc(p.pitfall)}</p></div>
  ${links?`<div class="card"><h4>${p.tier==="N"?"Adjunct agents — no specific antidote":p.tier==="D"?"Agents — investigational or not obtainable":"Antidote agents"}</h4><div class="linkrow">${links}</div></div>`:""}
  <div class="card"><h4>Sources</h4><div class="srcline">${src}</div></div>
  <div class="foot">Last reviewed ${esc(p.lastReviewed||VERSION.lastReviewed)}. Confirm every dose against your own formulary before administration.</div>`;
}

function viewAgent(id){
  const a=A[id];
  const rows=a.treats.map(x=>T[x]).filter(Boolean).map(toxRow).join("");
  return `
  <div class="hero">
    <div class="glyph" style="background:color-mix(in srgb,var(--teal) 20%,var(--surf));color:var(--teal)">⚕</div>
    <div><h3>${esc(a.name)}</h3><div class="badges">
      <span class="badge teal">${esc(a.class)}</span>
      <span class="badge">${a.treats.length} indication${a.treats.length>1?"s":""}</span>
    </div></div>
  </div>
  ${a.brands.length?`<div class="card"><h4>Also known as</h4><p>${esc(a.brands.join(" · "))}</p></div>`:""}
  <div class="lbl">Used for</div>${rows}`;
}

/* ---------- paint ---------- */
function paint(){
  const top=stack[stack.length-1];
  $("back").hidden=!top; $("fav").hidden=!(top&&top.kind==="toxin");
  document.querySelectorAll("nav button").forEach(b=>
    b.setAttribute("aria-current",b.dataset.tab===tab&&!top?"page":"false"));
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));

  if(top){
    const el=$("v-detail"); el.classList.add("on");
    if(top.kind==="toxin"){
      $("title").textContent=T[top.id].name; el.innerHTML=viewToxin(top.id);
      $("fav").classList.toggle("on",favs.includes(top.id));
      $("fav").textContent=favs.includes(top.id)?"★":"☆";
      $("fav").onclick=()=>{ favs=favs.includes(top.id)?favs.filter(x=>x!==top.id):[top.id,...favs];
        store.set("favs",favs); paint(); };
    } else { $("title").textContent=A[top.id].name; el.innerHTML=viewAgent(top.id); }
    wire(el); window.scrollTo(0,0); return;
  }

  const map={home:["v-home",viewHome,"TOXCARD"],toxins:["v-toxins",viewToxins,"Toxins"],
    agents:["v-agents",viewAgents,"Antidotes"],tools:["v-tools",viewTools,"Tools"],favs:["v-favs",viewFavs,"Saved"]};
  const [vid,fn,title]=map[tab];
  const el=$(vid); el.classList.add("on"); $("title").textContent=title; el.innerHTML=fn();
  wire(el);

  if(tab==="home"){
    const inp=$("hq");
    inp.addEventListener("input",e=>{ q=e.target.value; const r=search(q);
      $("hbody").style.display=q.trim()?"none":"";
      $("hres").innerHTML=q.trim()?(r.length?`<div class="lbl">${r.length} result${r.length>1?"s":""}</div>`+r.map(toxRow).join("")
        :'<p class="empty">Nothing matches that. Try the toxin, the agent, or a brand name.</p>'):"";
      wire($("hres")); });
    el.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
    if(q.trim()) inp.dispatchEvent(new Event("input"));
  }
  if(tab==="toxins") el.querySelectorAll("[data-cat]").forEach(b=>
    b.addEventListener("click",()=>{ cat=b.dataset.cat; paint(); }));
  if(tab==="agents"){ const i=$("aq");
    i.addEventListener("input",e=>{ agentQ=e.target.value; const s=i.selectionStart; paint();
      const n=$("aq"); if(n){ n.focus(); n.setSelectionRange(s,s);} }); }
  if(tab==="tools"){
    const rw=()=>{ const w=parseFloat($("wt").value), h=parseFloat($("ht").value);
      WT=(isFinite(w)&&w>0&&w<=300)?w:null; HT=(isFinite(h)&&h>0&&h<=230)?h:null;
      store.set("wt",WT); store.set("ht",HT);
      $("wthint").textContent=!WT?"Enter a weight and every mg/kg dose in the file resolves on the entry page."
        :!HT?`Resolving at ${WT} kg · add a height for mg/m² doses`
        :`Resolving at ${WT} kg · BSA ${tidy(bsa())} m² (Mosteller)`; };
    $("wt").addEventListener("input",rw); $("ht").addEventListener("input",rw);
    $("wtclear").addEventListener("click",()=>{ $("wt").value=""; $("ht").value=""; rw(); });
    rw();
    el.querySelectorAll("[data-txd]").forEach(b=>b.addEventListener("click",()=>{
      openTox=openTox===b.dataset.txd?null:b.dataset.txd;
      el.querySelectorAll("[data-txd]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.txd===openTox));
      const t=TOXIDROMES.find(x=>x.id===openTox);
      $("txout").innerHTML=t?txDetail(t):"";
      if(t) $("txgo").addEventListener("click",()=>{ q=t.search; go("home"); });
    }));
    if(openTox){ const t=TOXIDROMES.find(x=>x.id===openTox); $("txout").innerHTML=txDetail(t);
      $("txgo").addEventListener("click",()=>{ q=t.search; go("home"); }); }
  }
  window.scrollTo(0,0);
}

paint();
setTimeout(()=>$("splash").classList.add("gone"),900);
setTimeout(()=>$("splash").remove(),1400);

/* ---------- data refresh ----------
   Only over http(s), only forward, never a reload: the fetched set is validated, kept
   in storage for the next cold start, and painted in place. A failed or stale fetch
   changes nothing. */
(async()=>{
  if(!navigator.onLine) return;
  if(!location.protocol.startsWith("http")) return;
  try{
    const r=await fetch("data/version.json",{cache:"no-store"}); if(!r.ok) return;
    const v=await r.json();
    if(typeof v.version!=="string"||v.version<=VERSION.version) return;
    const [tx,ag,pr]=await Promise.all(["toxins","antidote-agents","protocols"]
      .map(f=>fetch("data/"+f+".json",{cache:"no-store"}).then(x=>x.ok?x.json():null)));
    if(!Array.isArray(tx)||tx.length<50) return;             // sanity gate
    if(!Array.isArray(ag)||!ag.length) return;
    if(!Array.isArray(pr)||pr.length!==tx.length) return;
    store.set("data",{version:v.version,meta:v,toxins:tx,agents:ag,protocols:pr});
    TOXINS.length=0; TOXINS.push(...tx);
    AGENTS.length=0; AGENTS.push(...ag);
    PROTOCOLS.length=0; PROTOCOLS.push(...pr);
    Object.assign(VERSION,v);
    reindex(); paint();
  }catch(e){}
})();

if("serviceWorker" in navigator && location.protocol.startsWith("http"))
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
