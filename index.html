 Give it on clinical suspicion; do not wait for laboratory confirmation, which takes days. Descending, symmetric, bulbar-first weakness with a clear sensorium is the pattern.","window":"","sources":[{"label":"BAT prescribing information","type":"FDA label"},{"label":"CDC botulism clinical guidance","type":"CDC"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-086-infant-botulism-1-y-toxin-types-a-and-b","toxinId":"086-infant-botulism-1-y-toxin-types-a-and-b","antidoteIds":["babybig"],"tier":"A","agentLine":"BabyBIG (human botulism immune globulin IV)","dose":"50 mg/kg (1 mL/kg) IV as a single infusion, through a dedicated line\nStart at 0.5 mL/kg/h; if tolerated at 15 min, increase to 1 mL/kg/h — do not exceed\nAvailable only from the California Infant Botulism Treatment and Prevention Program: 510-231-7600","pitfall":"Do not give equine BAT to an infant if BabyBIG is obtainable — the human product avoids serum sickness and shortens hospital stay by weeks. Aminoglycosides potentiate the neuromuscular blockade and should be avoided for any concurrent infection.","window":"","sources":[{"label":"BabyBIG prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-087-tetanus","toxinId":"087-tetanus","antidoteIds":["tig"],"tier":"B","agentLine":"Human tetanus immune globulin + metronidazole + wound debridement","dose":"HTIG 3000–6000 units IM, part infiltrated around the wound\nMetronidazole 500 mg IV q6–8h (preferred over penicillin)\nBenzodiazepines, magnesium infusion, and often neuromuscular blockade for spasms","pitfall":"Penicillin is a GABA antagonist and may worsen spasms; metronidazole is the better choice. Immune globulin does not touch toxin already fixed to neurons, so the illness still runs its weeks-long course. Active immunization is still required — the disease does not confer immunity.","window":"","sources":[{"label":"CDC tetanus clinical guidance","type":"CDC"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-088-diphtheria","toxinId":"088-diphtheria","antidoteIds":["dat"],"tier":"B","agentLine":"Diphtheria antitoxin (equine)","dose":"20,000–120,000 units by clinical severity and duration\nAvailable through CDC under IND; call the Emergency Operations Center","pitfall":"Sensitivity testing before administration is required — this is horse serum with a meaningful anaphylaxis rate. Antibiotics stop transmission but do not neutralize toxin; only antitoxin does, and only before it binds.","window":"","sources":[{"label":"CDC diphtheria antitoxin guidance","type":"CDC"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-089-inhalational-anthrax","toxinId":"089-inhalational-anthrax","antidoteIds":["anthrax-mab"],"tier":"B","agentLine":"Raxibacumab, obiltoxaximab, or anthrax immune globulin IV","dose":"Raxibacumab 40 mg/kg IV; obiltoxaximab 16 mg/kg IV — both with premedication for infusion reactions\nAlways combined with two-drug antimicrobial therapy plus a protein synthesis inhibitor","pitfall":"Monoclonals target protective antigen and are adjuncts, never monotherapy. Pleural effusions must be drained — they are toxin reservoirs, and drainage independently improves survival.","window":"","sources":[{"label":"Anthim and raxibacumab prescribing information","type":"FDA label"},{"label":"CDC anthrax clinical framework, MMWR","type":"CDC"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-090-amatoxin-mushrooms-amanita-phalloides-a-ocreata-galerina-lep","toxinId":"090-amatoxin-mushrooms-amanita-phalloides-a-ocreata-galerina-lep","antidoteIds":["silibinin"],"tier":"D","agentLine":"No FDA-approved therapy; IV silibinin (investigational), NAC, penicillin G","dose":"Aggressive IV crystalloid to maintain renal elimination\nSilibinin (Legalon SIL) 5 mg/kg load then 20 mg/kg/day continuous — the US expanded-access protocol terminated in 2020 and no active supply pathway remains; single-patient IND is the only route\nNAC and high-dose penicillin G, both off-label; activated charcoal, multi-dose\nEarly transplant centre referral","pitfall":"The 6- to 24-hour symptom-free latency is the trap: a patient with a normal panel at presentation may already be committed to hepatic failure. Any gastrointestinal illness beginning six or more hours after a foraged mushroom meal is amatoxin until proven otherwise. Silibinin's US pivotal trial was terminated without analysis, so the evidence base remains observational.","window":"Before the hepatic phase; latency is 6–24 h","sources":[{"label":"MMWR, Amanita ocreata poisoning cluster, May 2026","type":"CDC"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-091-ricin-and-abrin","toxinId":"091-ricin-and-abrin","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Supportive; decontamination; aggressive fluid resuscitation for the GI form","pitfall":"Inhalational exposure produces delayed pulmonary edema at 8 to 24 hours. There is no antidote and no useful chelation — resist the pressure to give something.","window":"","sources":[{"label":"HHS CHEMM","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-092-serotonin-syndrome","toxinId":"092-serotonin-syndrome","antidoteIds":["cyproheptadine","benzodiazepine"],"tier":"C","agentLine":"Benzodiazepines, active cooling, cyproheptadine","dose":"Benzodiazepines first and generously\nCyproheptadine 12 mg PO, then 2 mg q2h until response (max 32 mg/day)\nHyperthermia >41.1°C: intubate, paralyze with a non-depolarizing agent, cool aggressively","pitfall":"Hyperthermia from sustained muscle activity is what kills, and it is the one thing that must be treated within minutes. Paralysis stops heat production; antipyretics do nothing because the hypothalamic set point is normal. Physical restraints worsen isometric contraction and lactate. Avoid succinylcholine if rhabdomyolysis has raised potassium.","window":"","sources":[{"label":"Boyer & Shannon, serotonin syndrome, N Engl J Med 2005","type":"Literature"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-093-neuroleptic-malignant-syndrome","toxinId":"093-neuroleptic-malignant-syndrome","antidoteIds":["dantrolene","bromocriptine"],"tier":"C","agentLine":"Stop the antipsychotic; dantrolene, bromocriptine, benzodiazepines","dose":"Dantrolene 1–2.5 mg/kg IV, repeat to 10 mg/kg/day\nBromocriptine 2.5 mg PO q8h; amantadine 100 mg q8h as an alternative\nRestart any abruptly withdrawn dopaminergic agent","pitfall":"Onset is over days with lead-pipe rigidity and hyporeflexia — the opposite of serotonin syndrome's rapid onset, clonus, and hyperreflexia. Getting the two confused sends you to the wrong antidote. Withdrawal of levodopa or an abrupt dopamine agonist change causes an identical picture.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-094-malignant-hyperthermia","toxinId":"094-malignant-hyperthermia","antidoteIds":["dantrolene"],"tier":"A","agentLine":"Dantrolene","dose":"2.5 mg/kg IV rapidly, repeat q5–10 min to 10 mg/kg or more\nRyanodex 250 mg per vial reconstitutes in seconds; classic dantrolene needs 60 mL sterile water per 20 mg vial\nStop the trigger, hyperventilate with 100% oxygen, cool, treat hyperkalemia\nMHAUS hotline 1-800-644-9737","pitfall":"Reconstituting classic dantrolene is slow and requires several people — know which formulation your cart holds before the crisis. Non-triggering anesthesia does not exclude the diagnosis in a delayed presentation. Recrudescence occurs in up to a quarter of cases; continue dantrolene for 24 to 48 hours.","window":"","sources":[{"label":"Ryanodex prescribing information","type":"FDA label"},{"label":"MHAUS treatment guidance","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-095-acute-dystonic-reaction-metoclopramide-prochlorperazine-anti","toxinId":"095-acute-dystonic-reaction-metoclopramide-prochlorperazine-anti","antidoteIds":["anticholinergic-dystonia"],"tier":"A","agentLine":"Diphenhydramine or benztropine","dose":"Diphenhydramine 25–50 mg IV/IM (pediatric 1 mg/kg)\nBenztropine 1–2 mg IV/IM\nContinue oral therapy for 48–72 h to prevent recurrence","pitfall":"Failing to prescribe the 2- to 3-day oral course sends the patient back with the same reaction once the parenteral dose wears off. Oculogyric crisis and laryngeal dystonia are frequently misdiagnosed as seizure or anaphylaxis.","window":"","sources":[{"label":"Benztropine mesylate prescribing information — drug-induced extrapyramidal disorders","type":"FDA label"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-096-lithium-toxicity","toxinId":"096-lithium-toxicity","antidoteIds":["hemodialysis"],"tier":"B","agentLine":"Hemodialysis — no antidote exists","dose":"EXTRIP: dialyze if level >5.0 mEq/L, or >4.0 mEq/L with renal impairment, or with decreased consciousness, seizures, or dysrhythmias\nNormal saline for volume repletion","pitfall":"Activated charcoal does not bind lithium — sodium polystyrene is a theoretical alternative, whole bowel irrigation for sustained-release preparations. Levels rebound 6 to 8 hours after dialysis as lithium redistributes out of cells; recheck before deciding you are finished. Chronic toxicity is far more dangerous at any given level than acute.","window":"","sources":[{"label":"EXTRIP workgroup recommendations, lithium","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-097-strychnine","toxinId":"097-strychnine","antidoteIds":["benzodiazepine"],"tier":"N","agentLine":"None","dose":"Benzodiazepines, dark quiet environment, early paralysis and intubation\nMonitor for rhabdomyolysis and hyperthermia","pitfall":"Consciousness is preserved throughout — the patient feels everything. Sedate deeply. Any stimulus, including examination, provokes convulsions.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-098-local-anesthetic-systemic-toxicity-last","toxinId":"098-local-anesthetic-systemic-toxicity-last","antidoteIds":["lipid"],"tier":"B","agentLine":"20% lipid emulsion","dose":"Over 70 kg: 100 mL bolus over 2–3 min, then ~250 mL over 15–20 min\nUnder 70 kg: 1.5 mL/kg bolus, then 0.25 mL/kg/min\nPersistent instability: repeat the bolus and double the infusion rate\nContinue the infusion at least 15 min after hemodynamic stability; maximum 12 mL/kg\nASRA 2020 checklist","pitfall":"Reduce epinephrine to boluses of 1 µg/kg or less — standard ACLS doses impair resuscitation in LAST. Avoid vasopressin, calcium channel blockers, beta-blockers, and any further local anesthetic. Call for the lipid before you are sure you need it, and keep monitoring at least 4 to 6 hours after apparent recovery: relapse is documented. No lipid emulsion carries a labelled indication for this — every product is approved for parenteral nutrition, so the use is off-label and guideline-endorsed rather than an approved antidote. Twelve mL/kg is a hard ceiling, not an approximation.","window":"","sources":[{"label":"ASRA Checklist for Treatment of Local Anesthetic Systemic Toxicity, 2020 v1.1","type":"Guideline"},{"label":"Intralipid 20% prescribing information, rev. 5/2023 — parenteral nutrition indication only","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-099-rocuronium-or-vecuronium-blockade","toxinId":"099-rocuronium-or-vecuronium-blockade","antidoteIds":["sugammadex"],"tier":"A","agentLine":"Sugammadex","dose":"2 mg/kg at reappearance of the second twitch\n4 mg/kg at post-tetanic count 1–2\n16 mg/kg for immediate reversal ~3 min after a single 1.2 mg/kg rocuronium dose","pitfall":"It binds hormonal contraceptives — patients need seven days of backup contraception, and telling them is not optional. Marked bradycardia and asystole have been reported within minutes. It does nothing for succinylcholine or for benzylisoquinolinium agents such as cisatracurium and atracurium.","window":"","sources":[{"label":"Bridion prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-100-non-depolarizing-blockade-routine-reversal","toxinId":"100-non-depolarizing-blockade-routine-reversal","antidoteIds":["neostigmine"],"tier":"A","agentLine":"Neostigmine + glycopyrrolate","dose":"Neostigmine 0.03–0.07 mg/kg with glycopyrrolate 0.2 mg per 1 mg neostigmine\nRequires at least some twitch response — will not reverse deep block","pitfall":"Given at deep block it produces paradoxical weakness. Always confirm train-of-four before reversing, and never use it as a substitute for sugammadex in a can't-intubate-can't-oxygenate rescue.","window":"","sources":[{"label":"ASA practice guidelines for monitoring and antagonism of neuromuscular blockade, Anesthesiology 2023","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-101-succinylcholine-apnea-pseudocholinesterase-deficiency","toxinId":"101-succinylcholine-apnea-pseudocholinesterase-deficiency","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Sedate and ventilate until spontaneous recovery, typically 4–8 h\nSend a dibucaine number and counsel the family — it is heritable","pitfall":"The error is assuming the patient is not waking for a neurologic reason. They are fully aware and paralyzed. Sedation is mandatory.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-102-hydrofluoric-acid-dermal-exposure","toxinId":"102-hydrofluoric-acid-dermal-exposure","antidoteIds":["calcium"],"tier":"B","agentLine":"Calcium gluconate, escalating by route","dose":"Topical 2.5% calcium gluconate gel, massaged in continuously\nIntradermal 5% calcium gluconate 0.5 mL/cm² for refractory pain\nIntra-arterial 10 mL of 10% calcium gluconate in 40 mL D5W over 4 h for digits\nIV calcium and magnesium for systemic toxicity; continuous ECG","pitfall":"Concentrations below 20% cause delayed pain over hours with normal-looking skin, so the burn is routinely underestimated at triage. What kills is not the wound but profound hypocalcemia, hypomagnesemia, and hyperkalemia causing dysrhythmia — an exposure of 2% body surface area with concentrated HF can be fatal. Never inject calcium chloride into tissue; it causes necrosis.","window":"","sources":[{"label":"HHS CHEMM hydrogen fluoride guidance","type":"Guideline"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-103-hydrofluoric-acid-inhalation","toxinId":"103-hydrofluoric-acid-inhalation","antidoteIds":["calcium"],"tier":"C","agentLine":"Nebulized calcium gluconate","dose":"2.5% calcium gluconate (2 mL of 10% in 3 mL saline) nebulized\nAggressive systemic calcium and magnesium replacement","pitfall":"Airway edema can be delayed. Anyone with inhalational HF exposure needs admission and serial ionized calcium regardless of how they look at hour one.","window":"","sources":[{"label":"HHS CHEMM hydrogen fluoride guidance","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-104-paraquat","toxinId":"104-paraquat","antidoteIds":[],"tier":"D","agentLine":"None — and oxygen is harmful","dose":"WITHHOLD supplemental oxygen unless SpO₂ <90%\nFuller's earth or activated charcoal immediately if presenting early\nImmunosuppression with cyclophosphamide and steroids is unproven","pitfall":"Giving oxygen reflexively accelerates the redox cycling that destroys the lung — this is the one poisoning where routine oxygen is contraindicated. Even small ingestions of concentrate are lethal over days to weeks by progressive pulmonary fibrosis, and there is no rescue after the first hours.","window":"","sources":[{"label":"WHO guidance on paraquat poisoning","type":"Guideline"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-105-caustics-strong-acids-and-alkalis","toxinId":"105-caustics-strong-acids-and-alkalis","antidoteIds":[],"tier":"N","agentLine":"None","dose":"No neutralization, no charcoal, no induced emesis, no blind NG placement\nEarly endoscopy at 12–24 h to grade injury; CT is increasingly used\nAirway assessment first","pitfall":"Attempting to neutralize generates an exothermic reaction and deepens the injury. Absence of oral burns does not exclude significant esophageal injury, particularly with alkalis and with liquid preparations.","window":"","sources":[{"label":"ESGE/ESPGHAN caustic ingestion guideline","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-106-hydrocarbons-kerosene-lamp-oil-lighter-fluid","toxinId":"106-hydrocarbons-kerosene-lamp-oil-lighter-fluid","antidoteIds":[],"tier":"N","agentLine":"None","dose":"No gastric emptying, no charcoal — aspiration is the injury\nSupportive respiratory care; observe 6 h for chemical pneumonitis","pitfall":"Avoid catecholamines where possible: halogenated and aromatic hydrocarbons sensitize the myocardium and epinephrine can precipitate ventricular fibrillation, which is the mechanism of sudden sniffing death.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-107-theophylline-and-caffeine","toxinId":"107-theophylline-and-caffeine","antidoteIds":["hemodialysis","esmolol"],"tier":"B","agentLine":"Hemodialysis; esmolol for dysrhythmia","dose":"Multi-dose activated charcoal 25 g q2–4h\nHD for acute level >100 µg/mL, chronic >60 µg/mL, or seizures/dysrhythmia at any level\nEsmolol 25–50 µg/kg/min for supraventricular tachycardia with hypotension\nReplete potassium","pitfall":"Hypokalemia here is intracellular shift, not deficit, and over-replacement causes rebound hyperkalemia once the drug clears. Chronic toxicity is dangerous at much lower levels than acute — the same number means different things.","window":"","sources":[{"label":"EXTRIP Workgroup, theophylline, Clin Toxicol 2015","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-108-colchicine","toxinId":"108-colchicine","antidoteIds":[],"tier":"D","agentLine":"No available antidote","dose":"Aggressive supportive care, G-CSF for marrow suppression\nAnti-colchicine Fab exists only as historical French compassionate use","pitfall":"The multiphasic course misleads: a GI phase, an apparent recovery, then multiorgan failure at 24 to 72 hours. Ingestions above 0.5 mg/kg have very high mortality. Do not discharge on the basis of improvement at 12 hours.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-109-metformin-associated-lactic-acidosis","toxinId":"109-metformin-associated-lactic-acidosis","antidoteIds":["hemodialysis"],"tier":"B","agentLine":"Hemodialysis with bicarbonate buffer","dose":"Dialyze for lactate >20 mmol/L, pH ≤7.0, shock, or failure to improve\nExtended or repeated sessions are often required","pitfall":"Bicarbonate infusion alone does not address the ongoing lactate production and can worsen intracellular acidosis. The decision to dialyze rests on the acidosis and the clinical trajectory, not on the metformin level, which is rarely available in time.","window":"","sources":[{"label":"EXTRIP Workgroup, metformin","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-110-single-dose-activated-charcoal","toxinId":"110-single-dose-activated-charcoal","antidoteIds":["charcoal"],"tier":"B","agentLine":"Activated charcoal","dose":"1 g/kg, maximum 50 g PO or by NG\nGreatest benefit within 1 h; longer for anticholinergics, opioids, and sustained-release products","pitfall":"Does not bind metals (iron, lithium, lead), alcohols, hydrocarbons, caustics, or potassium. Requires an intact or protected airway — aspiration of charcoal causes a severe, sometimes fatal pneumonitis, and is the reason routine use has fallen away.","window":"Greatest benefit within 1 h of ingestion","sources":[{"label":"AACT/EAPCCT position paper: single-dose activated charcoal","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-111-multi-dose-activated-charcoal","toxinId":"111-multi-dose-activated-charcoal","antidoteIds":["charcoal"],"tier":"B","agentLine":"Activated charcoal, repeated","dose":"25 g q2–4h after the initial dose\nEstablished benefit: carbamazepine, dapsone, phenobarbital, quinine, theophylline","pitfall":"Omit the sorbitol after the first dose — repeated cathartics cause dangerous fluid and electrolyte shifts, especially in children. Confirm bowel sounds before each dose; ileus turns this into an obstruction.","window":"","sources":[{"label":"AACT/EAPCCT position statement: multi-dose activated charcoal","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-112-whole-bowel-irrigation","toxinId":"112-whole-bowel-irrigation","antidoteIds":["wbi"],"tier":"C","agentLine":"Polyethylene glycol electrolyte solution","dose":"1–2 L/h in adults, 500 mL/h in children, until the rectal effluent runs clear\nUse for sustained-release calcium channel blockers and beta-blockers, iron, lead, and body packers","pitfall":"Contraindicated with ileus, obstruction, perforation, hemodynamic instability, or an unprotected airway. It is labour-intensive and frequently abandoned halfway, which achieves nothing.","window":"","sources":[{"label":"AACT/EAPCCT position paper: whole bowel irrigation","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-113-urinary-alkalinization","toxinId":"113-urinary-alkalinization","antidoteIds":["bicarbonate"],"tier":"B","agentLine":"Sodium bicarbonate infusion","dose":"150 mEq NaHCO₃ in 1 L D5W at 1.5–2× maintenance; target urine pH 7.5–8.0\nUseful for salicylate, phenobarbital, methotrexate, chlorpropamide, 2,4-D","pitfall":"Hypokalemia defeats alkalinization — the kidney exchanges potassium for hydrogen and acidifies the urine regardless of what you infuse. Replace potassium first and continuously.","window":"","sources":[{"label":"AACT/EAPCCT position paper: urine alkalinization","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-114-extracorporeal-removal-extrip-guided","toxinId":"114-extracorporeal-removal-extrip-guided","antidoteIds":["hemodialysis"],"tier":"B","agentLine":"Intermittent hemodialysis","dose":"EXTRIP has published recommendations for 13 poisonings: acetaminophen, barbiturates,\ncarbamazepine, digoxin, lithium, metformin, methanol, phenytoin, salicylates, thallium,\ntheophylline, tricyclic antidepressants, and valproate\nEthylene glycol and diethylene glycol are dialysed on separate, well-established grounds\nHigh-flux, high blood-flow intermittent HD is preferred over CRRT for most","pitfall":"CRRT clears far less per hour and is a poor substitute when the patient is dying of the toxin rather than of hemodynamic instability. Rebound after dialysis is expected with lithium, valproate, and methanol — recheck levels. Note that several EXTRIP recommendations are recommendations against dialysis, so citing the workgroup is not the same as citing support.","window":"","sources":[{"label":"EXTRIP Workgroup recommendations","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-115-poison-induced-cardiac-arrest-or-refractory-shock","toxinId":"115-poison-induced-cardiac-arrest-or-refractory-shock","antidoteIds":["ecmo"],"tier":"C","agentLine":"VA-ECMO","dose":"Consider early for a reversible cardiotoxin with refractory shock or arrest\nBest-supported in calcium channel blocker, beta-blocker, and sodium channel blocker toxicity","pitfall":"The determinant of survival is how early the conversation happens. A patient on four vasopressors is already late. Toxicologic arrest has better neurologic outcomes than most other ECPR indications, which should lower the threshold rather than raise it.","window":"","sources":[{"label":"AHA 2023 focused update: cardiac arrest in toxicity","type":"Guideline"},{"label":"ELSO guidance","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-oleander-and-yellow-oleander-nerium-oleander-thevetia-peruvi","toxinId":"oleander-and-yellow-oleander-nerium-oleander-thevetia-peruvi","antidoteIds":["digifab"],"tier":"B","agentLine":"Digoxin immune Fab","dose":"Empiric 10–20 vials; response is less predictable than with digoxin\nSerum digoxin assay cross-reacts but does not quantify the plant glycoside\nMulti-dose activated charcoal; treat hyperkalaemia","pitfall":"The digoxin level tells you exposure occurred, not how much Fab to give — dose to clinical and electrocardiographic response, not to a number. Yellow oleander seed ingestion is a common suicidal method outside the US and carries high mortality; a single seed can kill a child. Oleander grows throughout South Texas as an ornamental.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"},{"label":"MMWR and case series on Nerium and Thevetia cardiotoxicity","type":"Literature"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-water-hemlock-cicuta-maculata","toxinId":"water-hemlock-cicuta-maculata","antidoteIds":[],"tier":"N","agentLine":"None — benzodiazepines and barbiturates for seizures","dose":"Aggressive benzodiazepines, then barbiturate or propofol; early intubation and paralysis\nMonitor for rhabdomyolysis, renal failure, and severe acidosis","pitfall":"The most violently toxic plant in North America. Cicutoxin causes status epilepticus within 15–90 minutes, often refractory to standard doses. Frequently misidentified as wild parsnip, wild carrot, or water parsnip by foragers — the root is the most toxic part.","window":"Seizures within 15–90 min of ingestion","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-poison-hemlock-conium-maculatum","toxinId":"poison-hemlock-conium-maculatum","antidoteIds":[],"tier":"N","agentLine":"None — supportive ventilation","dose":"Airway protection and mechanical ventilation until the alkaloid clears\nActivated charcoal if early; monitor for rhabdomyolysis","pitfall":"Ascending paralysis with a preserved sensorium — the patient is aware throughout. Death is respiratory, and survival is entirely a function of whether someone ventilates them. Distinguish from water hemlock, which seizes rather than paralyses; the two are commonly confused by name.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-yew-taxus-species","toxinId":"yew-taxus-species","antidoteIds":["bicarbonate"],"tier":"N","agentLine":"None","dose":"Sodium bicarbonate for QRS widening; magnesium and pacing for dysrhythmia\nDigoxin Fab is ineffective — taxines are not cardiac glycosides\nECMO has been used successfully in massive ingestion","pitfall":"Cardiac sodium and calcium channel blockade with wide-complex bradycardia progressing to asystole, typically within hours. There is no antidote, and reaching for digoxin Fab because the plant is a cardiotoxin wastes both time and vials. Ingestion of chewed needles is the lethal exposure; whole swallowed berries are usually benign because the seed passes intact.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-aconite-monkshood-wolfsbane-aconitum","toxinId":"aconite-monkshood-wolfsbane-aconitum","antidoteIds":["ecmo"],"tier":"N","agentLine":"None","dose":"Amiodarone or lidocaine for ventricular dysrhythmia; magnesium\nAtropine for bradycardia; ECMO for refractory arrest\nActivated charcoal early","pitfall":"Perioral and limb paraesthesia followed by refractory ventricular dysrhythmia. Most Western cases follow herbal preparations, particularly imported traditional Chinese medicines where processing was inadequate. Standard antiarrhythmics often fail and ECMO is the intervention with the best reported outcomes.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-jimson-weed-and-other-datura-species","toxinId":"jimson-weed-and-other-datura-species","antidoteIds":["physostigmine"],"tier":"B","agentLine":"Physostigmine where obtainable; otherwise rivastigmine and supportive care","dose":"See the antimuscarinic delirium entries for agent detail\nBenzodiazepines for agitation; active cooling; bladder scan for retention","pitfall":"Deliberate ingestion by adolescents seeking hallucinations is the usual story, and the delirium lasts 24 to 48 hours — far longer than they expect. Seeds are the most concentrated part. Do not use antipsychotics: their antimuscarinic activity compounds the toxidrome and their alpha-blockade worsens hyperthermia.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-grayanotoxin-rhododendron-azalea-mountain-laurel-mad-honey","toxinId":"grayanotoxin-rhododendron-azalea-mountain-laurel-mad-honey","antidoteIds":["atropine"],"tier":"C","agentLine":"Atropine","dose":"Atropine 0.5–1 mg IV for symptomatic bradycardia, repeat as needed\nIV fluids for hypotension; most resolve within 24 h","pitfall":"Bradycardia and hypotension with a clear sensorium after eating flowers, leaves, or unprocessed honey. Almost all recover fully with atropine and fluids, so aggressive intervention is rarely warranted. Texas mountain laurel is a different plant — it contains cytisine and produces a nicotinic picture instead.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-amanita-muscaria-and-a-pantherina-isoxazole-mushrooms","toxinId":"amanita-muscaria-and-a-pantherina-isoxazole-mushrooms","antidoteIds":["benzodiazepine"],"tier":"N","agentLine":"None — benzodiazepines","dose":"Benzodiazepines for agitation and myoclonus; supportive care\nAtropine is contraindicated — this is not a muscarinic syndrome despite the name","pitfall":"The name misleads: A. muscaria contains almost no muscarine. Giving atropine for a presumed cholinergic picture worsens the delirium. Expect an alternating pattern of agitation and somnolence over 6 to 24 hours with full recovery. This is not the deadly Amanita — that is A. phalloides or A. ocreata, which look nothing like it and behave nothing like it.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-cortinarius-species-orellanine","toxinId":"cortinarius-species-orellanine","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Supportive care; haemodialysis for established renal failure; transplant referral\nNo chelation or specific therapy exists","pitfall":"Renal failure appears 2 to 20 days after ingestion, long after any gastrointestinal upset has resolved and the patient has stopped connecting the two. A normal creatinine at presentation means nothing. Anyone with a foraged mushroom meal and later unexplained renal failure should be asked about Cortinarius specifically.","window":"Renal injury declares itself 2–20 days after ingestion","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-gastrointestinal-irritant-mushrooms-chlorophyllum-omphalotus","toxinId":"gastrointestinal-irritant-mushrooms-chlorophyllum-omphalotus","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Fluid and electrolyte resuscitation; antiemetics\nObserve for the late-onset pattern that would suggest amatoxin instead","pitfall":"Symptom onset within 2 hours is reassuring and points here. Onset beyond 6 hours points to amatoxin, Gyromitra, or Cortinarius and changes the entire disposition. Timing of the first symptom is the single most useful piece of history in mushroom poisoning.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-laundry-detergent-pods","toxinId":"laundry-detergent-pods","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Airway assessment first; early intubation for stridor or drooling\nObserve at least 4–6 h; endoscopy for persistent symptoms\nNo neutralisation, no charcoal, no induced emesis","pitfall":"These behave far worse than ordinary detergent. Children develop rapid CNS depression, vomiting, and airway oedema, and deaths have occurred from aspiration and laryngeal swelling. Ocular exposure from a burst pod causes corneal injury and needs irrigation and slit-lamp examination.","window":"Airway oedema can progress over the first hours","sources":[{"label":"AAP and CDC reports on detergent pod exposures","type":"Literature"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-camphor-camphorated-oil-chest-rubs-mothballs","toxinId":"camphor-camphorated-oil-chest-rubs-mothballs","antidoteIds":["benzodiazepine"],"tier":"N","agentLine":"None — benzodiazepines for seizures","dose":"Benzodiazepines; airway protection\nNo charcoal if seizure risk is imminent — aspiration risk\nObserve 4–6 h; symptoms begin within 5–90 min","pitfall":"One of the classic one-pill-can-kill exposures: a few millilitres of concentrated camphor can seize a toddler within minutes. Onset is fast, so a child who is well at 4 hours is unlikely to deteriorate — but the early window is genuinely dangerous. Camphor is not a mothball ingredient in most current products; confirm which compound is involved.","window":"Seizures within 5–90 min of ingestion","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-methyl-salicylate-oil-of-wintergreen-topical-analgesics","toxinId":"methyl-salicylate-oil-of-wintergreen-topical-analgesics","antidoteIds":["bicarbonate","hemodialysis"],"tier":"B","agentLine":"Sodium bicarbonate; haemodialysis","dose":"Manage exactly as salicylate poisoning — see that entry for alkalinisation and dialysis criteria\nOne teaspoon of oil of wintergreen ≈ 7 g of aspirin","pitfall":"The concentration is what kills. A single teaspoon exceeds the lethal dose for a small child, and the exposure is often dismissed because the product is a topical rub or a flavouring. Salicylate levels must be followed serially; a single early level is falsely reassuring because absorption from the oil is prolonged.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-essential-oils-eucalyptus-tea-tree-clove-pennyroyal-wintergr","toxinId":"essential-oils-eucalyptus-tea-tree-clove-pennyroyal-wintergr","antidoteIds":["acetylcysteine"],"tier":"N","agentLine":"None; NAC for pennyroyal hepatotoxicity","dose":"Airway and aspiration precautions; no induced emesis\nPennyroyal: acetylcysteine as for acetaminophen hepatotoxicity\nWintergreen: treat as salicylate","pitfall":"Two of these are not like the others. Wintergreen is salicylate and pennyroyal is hepatotoxic through a NAPQI-like metabolite; both need specific management while the rest need only aspiration precautions. The rise of concentrated oils sold for diffusers has made paediatric exposures more severe than the historical literature suggests.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-boric-acid-roach-powder-eyewash-denture-products","toxinId":"boric-acid-roach-powder-eyewash-denture-products","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Fluid resuscitation and electrolyte correction; haemodialysis in massive ingestion with renal failure\nActivated charcoal does not bind boric acid","pitfall":"The classic 'boiled lobster' erythroderma with desquamation follows a large ingestion, along with vomiting and blue-green emesis. Most household exposures are trivial; the dangerous ones are chronic or massive. Charcoal is useless here, which is easy to forget when reaching for a reflex decontamination.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-naphthalene-mothballs","toxinId":"naphthalene-mothballs","antidoteIds":["methylene-blue"],"tier":"N","agentLine":"None; methylene blue for methaemoglobinaemia","dose":"Check G6PD status where possible; methylene blue only if G6PD-replete\nExchange transfusion for severe haemolysis\nSupportive care; monitor haemoglobin and bilirubin for several days","pitfall":"Naphthalene causes haemolysis and methaemoglobinaemia, most severely in G6PD deficiency — the same population in whom methylene blue is contraindicated. Distinguish naphthalene from paradichlorobenzene mothballs, which are far less toxic: naphthalene balls sink in saturated salt water, paradichlorobenzene floats.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-button-battery-ingestion","toxinId":"button-battery-ingestion","antidoteIds":[],"tier":"N","agentLine":"None — this is a surgical emergency","dose":"Immediate radiograph; oesophageal lodgement requires endoscopic removal within 2 h\nHoney 10 mL every 10 min (age >12 months, <12 h since ingestion) while awaiting removal\nNothing by mouth otherwise; do not induce vomiting","pitfall":"Mucosal burn begins within 2 hours of oesophageal lodgement and perforation or aortoenteric fistula can follow days later. The child may be entirely asymptomatic. A coin and a battery look similar on film — the double-ring or halo sign identifies the battery, and getting this wrong costs the oesophagus.","window":"Endoscopic removal within 2 h of oesophageal lodgement","sources":[{"label":"NASPGHAN button battery guideline","type":"Guideline"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-rare-earth-magnet-ingestion-multiple","toxinId":"rare-earth-magnet-ingestion-multiple","antidoteIds":[],"tier":"N","agentLine":"None — surgical or endoscopic","dose":"Radiograph in two planes; multiple magnets or a magnet plus any metal object requires urgent removal\nA single magnet with no other metallic foreign body may be observed","pitfall":"Two magnets in different bowel loops attract across the walls and cause pressure necrosis, fistula, volvulus, and perforation — often days later and often without early symptoms. Counting the magnets on the film is the whole assessment; magnets stacked in a line can be mistaken for one.","window":"","sources":[{"label":"NASPGHAN foreign body guidance","type":"Guideline"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-nicotine-and-e-liquid","toxinId":"nicotine-and-e-liquid","antidoteIds":["atropine"],"tier":"N","agentLine":"None","dose":"Airway and antiemetics; benzodiazepines for seizures; atropine for bronchorrhoea and bradycardia\nSkin decontamination for dermal exposure to concentrate","pitfall":"Concentrated refill liquid is a paediatric lethal-dose problem: a few millilitres can kill a toddler. The picture is biphasic — early nicotinic stimulation with vomiting and tachycardia, then a depressive phase with bradycardia, weakness, and respiratory failure. The apparent improvement between phases is not recovery.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-chloramine-gas-bleach-mixed-with-ammonia","toxinId":"chloramine-gas-bleach-mixed-with-ammonia","antidoteIds":["oxygen"],"tier":"N","agentLine":"None","dose":"Remove from exposure; humidified oxygen; bronchodilators\nObserve for delayed pulmonary oedema in significant exposures","pitfall":"Almost always a domestic cleaning accident and almost always self-limiting, but a closed bathroom changes that. Nebulised bicarbonate is popular for chlorine and poorly supported; oxygen and bronchodilators are the treatment. Ask specifically what was mixed — the history is often given as 'cleaning fumes'.","window":"","sources":[{"label":"HHS CHEMM","type":"Guideline"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-ethanol-based-hand-sanitizer-ingestion","toxinId":"ethanol-based-hand-sanitizer-ingestion","antidoteIds":["dextrose"],"tier":"N","agentLine":"None","dose":"Dextrose and monitoring for hypoglycaemia, particularly in children\nAirway protection; check for co-ingested methanol in counterfeit product","pitfall":"Small children develop hypoglycaemia and profound CNS depression at ethanol levels adults tolerate. Counterfeit and improperly manufactured sanitizer has been found to contain methanol, so an unexpectedly severe presentation with acidosis or visual symptoms should prompt a toxic alcohol workup rather than reassurance.","window":"","sources":[{"label":"FDA methanol-contaminated hand sanitizer alerts","type":"FDA notice"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-chloroquine-and-hydroxychloroquine","toxinId":"chloroquine-and-hydroxychloroquine","antidoteIds":["bicarbonate"],"tier":"N","agentLine":"None — bicarbonate, epinephrine, aggressive potassium caution","dose":"Early intubation and sedation; sodium bicarbonate for QRS widening\nEpinephrine infusion for hypotension\nReplace potassium cautiously — hypokalaemia is intracellular shift and rebounds\nDiazepam has been used in high dose; evidence is historical","pitfall":"One or two adult tablets can kill a toddler, and deterioration is abrupt — from alert to arrest within an hour. The hypokalaemia is a shift, not a deficit, and aggressive replacement causes fatal rebound hyperkalaemia as the drug clears. Dialysis and charcoal haemoperfusion do not work; the volume of distribution is enormous.","window":"Deterioration within 1–2 h of ingestion","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-diphenoxylate-atropine-lomotil","toxinId":"diphenoxylate-atropine-lomotil","antidoteIds":["naloxone"],"tier":"A","agentLine":"Naloxone, with prolonged observation","dose":"Naloxone as for opioid toxicity, often by infusion\nAdmit and observe at least 24 h regardless of an asymptomatic interval","pitfall":"The trap is the delayed and biphasic course: an early anticholinergic phase from atropine, then opioid respiratory depression as diphenoxylate is metabolised, appearing up to 12 hours after ingestion. Any paediatric exposure is admitted. Discharging a well child at 6 hours has killed children.","window":"Opioid effect may not appear for up to 12 h","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-lindane-topical-scabicide","toxinId":"lindane-topical-scabicide","antidoteIds":["benzodiazepine"],"tier":"N","agentLine":"None — benzodiazepines","dose":"Benzodiazepines for seizures; wash the skin thoroughly\nNo oil-based products on the skin — they increase absorption","pitfall":"Seizures follow both ingestion and excessive topical use, and the highest-risk group is small, thin children treated for scabies with repeated applications. Oil-based emollients applied over lindane substantially increase systemic absorption.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-podophyllin-and-podophyllotoxin","toxinId":"podophyllin-and-podophyllotoxin","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Supportive care; monitor for delayed bone marrow suppression and neuropathy\nRemove any remaining topical product","pitfall":"A prolonged and biphasic illness: gastrointestinal upset and CNS depression early, then marrow suppression and a sensorimotor neuropathy over days to weeks. Systemic toxicity from topical application to large or mucosal surfaces is well described, especially in pregnancy where it is contraindicated.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-ssri-or-snri-overdose-in-isolation","toxinId":"ssri-or-snri-overdose-in-isolation","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Observation and supportive care; benzodiazepines for agitation\nECG for QT — citalopram and escitalopram prolong it dose-dependently\nWatch for serotonin syndrome if a second serotonergic agent is involved","pitfall":"Isolated SSRI overdose is usually benign, and the error is over-treating it. The exceptions are citalopram and escitalopram, where QT prolongation and seizures occur at high doses and warrant cardiac monitoring, and any co-ingestion that makes serotonin syndrome possible.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-lamotrigine","toxinId":"lamotrigine","antidoteIds":["bicarbonate"],"tier":"N","agentLine":"None","dose":"Sodium bicarbonate for QRS widening; benzodiazepines for seizures\nCardiac monitoring; extended-release preparations delay the peak","pitfall":"Massive overdose produces sodium channel blockade indistinguishable from tricyclic toxicity, which is not what most clinicians expect from an antiepileptic. Separately, a rash in a patient on lamotrigine is a different emergency — Stevens-Johnson syndrome — and must not be dismissed.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-carbamazepine","toxinId":"carbamazepine","antidoteIds":["charcoal","hemodialysis"],"tier":"B","agentLine":"Multi-dose activated charcoal; haemodialysis","dose":"MDAC 25 g q4h if bowel sounds present\nEXTRIP: dialysis for severe toxicity, refractory seizures, or life-threatening dysrhythmia\nCardiac monitoring; anticholinergic features are common","pitfall":"Absorption is erratic and prolonged, so levels rise for many hours and a plateau is not a peak. Carbamazepine is one of the few poisonings where multi-dose charcoal has real evidence behind it. Cyclic coma with fluctuating consciousness is characteristic and is often mistaken for improvement.","window":"","sources":[{"label":"EXTRIP Workgroup, carbamazepine, Clin Toxicol 2014","type":"Consensus"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-phenytoin-and-fosphenytoin","toxinId":"phenytoin-and-fosphenytoin","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Stop the infusion; supportive care\nEXTRIP suggests extracorporeal removal only in severe toxicity\nPurple glove syndrome and hypotension are infusion-rate related","pitfall":"Oral overdose causes ataxia, nystagmus, and coma but is rarely fatal. The dangerous route is intravenous: rapid infusion causes hypotension and asystole from the propylene glycol diluent, not the phenytoin. Fosphenytoin avoids this and should be used where rapid loading is needed.","window":"","sources":[{"label":"EXTRIP Workgroup, phenytoin","type":"Consensus"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-atypical-antipsychotics-quetiapine-olanzapine-risperidone","toxinId":"atypical-antipsychotics-quetiapine-olanzapine-risperidone","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Supportive care; benzodiazepines for agitation\nECG for QT; avoid additional QT-prolonging agents\nAnticholinergic and alpha-blocking features are common","pitfall":"Quetiapine produces deep sedation and tachycardia that reliably prompts intubation, and most patients would have woken on their own. Olanzapine can cause a fluctuating agitated delirium alternating with coma. Physostigmine is not appropriate here despite the antimuscarinic features, because of the sodium channel and QT effects.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-cyclobenzaprine-tizanidine-and-other-muscle-relaxants","toxinId":"cyclobenzaprine-tizanidine-and-other-muscle-relaxants","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Supportive care; benzodiazepines\nCyclobenzaprine is structurally a tricyclic — monitor QRS\nTizanidine causes marked hypotension and bradycardia","pitfall":"Cyclobenzaprine's tricyclic structure means large overdoses produce sodium channel blockade and anticholinergic delirium, which surprises people who file it under 'muscle relaxant'. Tizanidine is an alpha-2 agonist and behaves like clonidine.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-quinine-and-quinidine","toxinId":"quinine-and-quinidine","antidoteIds":["bicarbonate","magnesium"],"tier":"N","agentLine":"None — bicarbonate, magnesium","dose":"Sodium bicarbonate for QRS widening; magnesium for torsades\nMulti-dose activated charcoal\nOphthalmology involvement for visual loss","pitfall":"Blindness from retinal toxicity is the feature that separates quinine from other antiarrhythmics, and it can be permanent. Historical treatments aimed at increasing elimination — stellate ganglion block, aggressive dialysis — do not work and have been abandoned. Quinine in leg-cramp remedies remains a source of exposure.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-amiodarone","toxinId":"amiodarone","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Supportive care; atropine and pacing for bradycardia\nAcute oral overdose is usually well tolerated","pitfall":"Acute overdose is far less dangerous than the chronic drug. The real toxicities — pulmonary fibrosis, thyroid dysfunction, hepatitis, optic neuropathy — accumulate over months and present as a diagnostic problem, not a poisoning. Intravenous loading causes hypotension from the polysorbate diluent.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-gabapentin-and-pregabalin","toxinId":"gabapentin-and-pregabalin","antidoteIds":["hemodialysis"],"tier":"N","agentLine":"None","dose":"Supportive care and observation\nHaemodialysis clears both, rarely required except in renal failure","pitfall":"Overdose alone is usually benign; the danger is additive respiratory depression with opioids, and gabapentinoids now appear in a large share of opioid deaths. In renal impairment, therapeutic doses accumulate and produce myoclonus and encephalopathy that is regularly misread as a neurological event.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-loperamide-in-massive-dose","toxinId":"loperamide-in-massive-dose","antidoteIds":["bicarbonate","magnesium"],"tier":"N","agentLine":"None — bicarbonate, magnesium","dose":"Sodium bicarbonate for QRS widening; magnesium for torsades\nNaloxone does not reverse the cardiac toxicity\nProlonged cardiac monitoring — the half-life is long","pitfall":"Taken in gram quantities for opioid effect or withdrawal self-treatment, loperamide blocks cardiac sodium and potassium channels and causes syncope, torsades, and sudden death. Naloxone addresses the opioid effect and does nothing for the dysrhythmia, which is what kills.","window":"","sources":[{"label":"FDA safety communication on loperamide abuse","type":"FDA notice"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-dextromethorphan","toxinId":"dextromethorphan","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Benzodiazepines for agitation; supportive care\nWatch for serotonin syndrome with concurrent serotonergic agents\nCheck the preparation for acetaminophen","pitfall":"Combination cough products are the hidden hazard: an adolescent taking a large dose for dissociative effect may also be taking a large dose of acetaminophen. Check the formulation and send a paracetamol level before attributing everything to dextromethorphan.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-ketamine","toxinId":"ketamine","antidoteIds":["benzodiazepine"],"tier":"N","agentLine":"None","dose":"Benzodiazepines for emergence agitation; supportive care\nChronic use: ulcerative cystitis and biliary tract disease","pitfall":"Acute recreational overdose is rarely lethal alone and is dangerous mainly through aspiration, trauma, and co-ingestion. Chronic heavy use causes a severe ulcerative cystitis with contracted bladder and obstructive uropathy that is frequently missed because the urinary complaint is not connected to the drug history.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-cocaine","toxinId":"cocaine","antidoteIds":["benzodiazepine","bicarbonate"],"tier":"N","agentLine":"None — benzodiazepines are first line","dose":"Benzodiazepines generously for agitation, hypertension, and chest pain\nAspirin and nitroglycerin for ischaemia; phentolamine for refractory hypertension\nActive cooling for hyperthermia; sodium bicarbonate for QRS widening","pitfall":"Benzodiazepines treat almost everything here because the driver is central sympathetic outflow. Beta-blockade during the acute sympathomimetic surge risks unopposed alpha stimulation and is avoided. Hyperthermia and agitated delirium, not the cardiac effects, are what kill in the emergency department.","window":"","sources":[{"label":"AHA scientific statement on cocaine-associated chest pain","type":"Guideline"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-amphetamine-and-methamphetamine","toxinId":"amphetamine-and-methamphetamine","antidoteIds":["benzodiazepine"],"tier":"N","agentLine":"None — benzodiazepines","dose":"Benzodiazepines titrated to sedation; active cooling\nIV fluids; monitor creatine kinase and renal function\nAntipsychotics worsen hyperthermia and lower the seizure threshold","pitfall":"Hyperthermia with agitated delirium is the lethal syndrome and it needs sedation and cooling within minutes, not physical restraint. Restraint alone increases isometric heat production and lactate. If sedation fails, intubate and paralyse.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-mdma","toxinId":"mdma","antidoteIds":["benzodiazepine"],"tier":"N","agentLine":"None","dose":"Benzodiazepines; active cooling\nCheck sodium — hyponatraemia from SIADH plus free-water intake is common\nHypertonic saline for symptomatic hyponatraemia","pitfall":"Two mechanisms compete and the treatment differs. Hyperthermia needs cooling and sedation; hyponatraemic seizures need hypertonic saline and fluid restriction. Giving free water to a hyperthermic MDMA patient with SIADH has caused fatal cerebral oedema, mostly in young women.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-synthetic-cathinones-bath-salts","toxinId":"synthetic-cathinones-bath-salts","antidoteIds":["benzodiazepine"],"tier":"N","agentLine":"None","dose":"Benzodiazepines in large doses; active cooling; IV fluids\nMonitor creatine kinase, potassium, and renal function","pitfall":"Agitation is often far more severe and prolonged than with cocaine or amphetamine, and doses of benzodiazepine that would sedate other patients fail. Routine urine drug screens do not detect these compounds, so a negative screen means nothing.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-synthetic-cannabinoids","toxinId":"synthetic-cannabinoids","antidoteIds":["benzodiazepine"],"tier":"N","agentLine":"None","dose":"Benzodiazepines; supportive care\nConsider brodifacoum contamination if there is unexplained bleeding — check INR","pitfall":"Presentation ranges from somnolence to seizures, acute kidney injury, and myocardial ischaemia in young people, none of which resembles cannabis. Contamination with long-acting anticoagulant rodenticide has caused outbreaks of severe coagulopathy; an unexplained raised INR in this population is the clue.","window":"","sources":[{"label":"MMWR, brodifacoum-adulterated synthetic cannabinoid outbreak, 2018","type":"CDC"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-inhalants-toluene-difluoroethane-butane-propellants","toxinId":"inhalants-toluene-difluoroethane-butane-propellants","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Avoid catecholamines where possible — the myocardium is sensitised\nToluene: expect severe hypokalaemia, non-anion-gap acidosis, and weakness\nSupportive care and observation","pitfall":"Sudden sniffing death is a catecholamine-sensitised ventricular dysrhythmia, so a startled or physically restrained user is at real risk and epinephrine is relatively contraindicated. Chronic toluene abuse produces a distal renal tubular acidosis with profound hypokalaemia presenting as quadriparesis.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-kratom-mitragyna-speciosa","toxinId":"kratom-mitragyna-speciosa","antidoteIds":["naloxone"],"tier":"C","agentLine":"Naloxone — partial and variable reversal","dose":"Supportive care; naloxone for respiratory depression, response is variable\nBenzodiazepines for seizures and agitation\nManage withdrawal as opioid withdrawal","pitfall":"Sold as a herbal supplement and taken as one, so patients frequently do not report it as a drug. It has genuine opioid activity, causes dependence and a withdrawal syndrome, and has caused hepatotoxicity and seizures. Deaths are usually in combination with other sedatives.","window":"","sources":[{"label":"FDA advisories on kratom","type":"FDA notice"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-nitrous-oxide-whippets","toxinId":"nitrous-oxide-whippets","antidoteIds":["hydroxocobalamin"],"tier":"N","agentLine":"None — B12 replacement for neurological injury","dose":"Acute: oxygen and supportive care\nChronic: hydroxocobalamin or cyanocobalamin, methionine, folate\nCheck B12, homocysteine, and methylmalonic acid — B12 may be normal","pitfall":"Heavy chronic use inactivates vitamin B12 and produces subacute combined degeneration of the cord: paraesthesia, ataxia, and myelopathy in a young person. The serum B12 can be entirely normal because the vitamin is present but functionally inactive — homocysteine and methylmalonic acid are the tests that show it.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-pyrethrins-and-pyrethroids","toxinId":"pyrethrins-and-pyrethroids","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Wash the skin; vitamin E oil for paraesthesia\nBenzodiazepines for the rare seizure\nSupportive care; most exposures are mild","pitfall":"The commonest presentation is facial and hand paraesthesia after dermal contact, which resolves without treatment. Severe systemic toxicity is rare and usually reflects the hydrocarbon solvent rather than the pyrethroid. Anaphylaxis to pyrethrins occurs and is a separate problem.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-glyphosate-surfactant-herbicide","toxinId":"glyphosate-surfactant-herbicide","antidoteIds":["hemodialysis"],"tier":"N","agentLine":"None","dose":"Aggressive fluid resuscitation; correct acidosis; airway protection\nMonitor for corrosive gastrointestinal injury and renal failure\nHaemodialysis for severe acidosis or renal failure","pitfall":"The surfactant, not the glyphosate, drives the toxicity — hypotension, corrosive injury, and pulmonary oedema after large deliberate ingestion. Small dermal or spray exposures are usually trivial, which makes the severe deliberate ingestions easy to underestimate.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-deet","toxinId":"deet","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Wash the skin; supportive care; benzodiazepines for seizures","pitfall":"Reported encephalopathy and seizures are almost entirely from ingestion or from heavy, repeated application to young children under occlusion. Normal repellent use is safe, and reassurance is usually the correct intervention.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-simple-asphyxiants-nitrogen-argon-helium-carbon-dioxide-meth","toxinId":"simple-asphyxiants-nitrogen-argon-helium-carbon-dioxide-meth","antidoteIds":["oxygen"],"tier":"N","agentLine":"None — oxygen","dose":"Remove from the environment; 100% oxygen; supportive care\nNo antidote — the injury is hypoxic, not toxic","pitfall":"Scene safety dominates. Confined-space deaths regularly claim the would-be rescuer, and multiple casualties at one scene should be assumed to be an oxygen-displaced atmosphere until proven otherwise. Carbon dioxide additionally causes narcosis and acidosis rather than pure displacement.","window":"","sources":[{"label":"HHS CHEMM","type":"Guideline"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-arsine-gas","toxinId":"arsine-gas","antidoteIds":["hemodialysis"],"tier":"N","agentLine":"None — chelation does not work","dose":"Exchange transfusion for massive haemolysis; haemodialysis for renal failure\nAggressive hydration and alkalinisation\nChelation is ineffective and should not delay transfusion","pitfall":"This is not arsenic poisoning and must not be treated as such. Arsine causes explosive intravascular haemolysis with abdominal pain, dark urine, and jaundice within hours, followed by renal failure. Chelators do not bind arsine, and reaching for BAL wastes the window for exchange transfusion.","window":"","sources":[{"label":"HHS CHEMM","type":"Guideline"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-methyl-bromide-and-other-fumigants","toxinId":"methyl-bromide-and-other-fumigants","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Remove from exposure; supportive care\nMonitor for delayed pulmonary oedema and neurological injury\nProtect responders — residual gas persists in treated structures","pitfall":"Neurological injury and pulmonary oedema are delayed by hours to days, so an asymptomatic exposed worker cannot be cleared early. Structural fumigation incidents have poisoned families who re-entered a treated building prematurely.","window":"","sources":[{"label":"HHS CHEMM","type":"Guideline"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-massive-hymenoptera-envenomation-africanized-honeybee-attack","toxinId":"massive-hymenoptera-envenomation-africanized-honeybee-attack","antidoteIds":[],"tier":"N","agentLine":"None — supportive; antivenom is not available in the US","dose":"Remove stingers; aggressive fluid resuscitation\nMonitor creatine kinase, potassium, renal function, and haemolysis for several days\nEpinephrine and standard anaphylaxis care if that component is present","pitfall":"Two entirely different illnesses share the presentation. Anaphylaxis from a single sting kills within minutes; envenomation syndrome from hundreds of stings kills over days through rhabdomyolysis, haemolysis, and renal failure. Africanized bees are established across South Texas and mass attacks occur.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-imported-fire-ant-solenopsis-invicta","toxinId":"imported-fire-ant-solenopsis-invicta","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Local wound care; do not unroof the sterile pustules\nAntihistamines and analgesia; epinephrine for anaphylaxis","pitfall":"The sterile pustule at 24 hours is characteristic and is not infection — treating it with antibiotics or unroofing it invites secondary infection. Anaphylaxis is the real risk and warrants an adrenaline autoinjector prescription in anyone with a systemic reaction.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-gila-monster-heloderma-suspectum","toxinId":"gila-monster-heloderma-suspectum","antidoteIds":[],"tier":"N","agentLine":"None — no antivenom exists","dose":"Detach the animal; irrigate and radiograph for retained teeth\nAnalgesia and fluid resuscitation for hypotension\nObserve for angio-oedema","pitfall":"The animal holds on and chews, so retained teeth in the wound are common and are the usual source of persistent problems. Hypotension can be marked and out of proportion to the local wound. No antivenom exists anywhere.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-ciguatera","toxinId":"ciguatera","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Supportive care and analgesia; amitriptyline or gabapentin for chronic dysaesthesia\nIntravenous mannitol has been used and is not supported by controlled evidence\nAdvise avoidance of fish, alcohol, nuts, and caffeine during recovery","pitfall":"The signature is reversal of hot and cold sensation with paraesthesia after eating a large reef fish, and it can persist for months. Cooking does not destroy the toxin. Recurrence is provoked by alcohol and by eating fish again, so dietary advice at discharge is part of the treatment.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-scombroid-histamine-fish-poisoning","toxinId":"scombroid-histamine-fish-poisoning","antidoteIds":[],"tier":"N","agentLine":"None — antihistamines","dose":"H1 and H2 antihistamines; this is a histamine reaction, not an allergy\nEpinephrine rarely needed; supportive care","pitfall":"Flushing, headache, and palpitations shortly after eating a peppery-tasting tuna, mahi-mahi, or mackerel. It is regularly misdiagnosed as fish allergy, and the consequence is a patient told to avoid fish for life for a condition caused by spoilage. Other diners becoming ill supports the diagnosis.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-tetrodotoxin-pufferfish-blue-ringed-octopus","toxinId":"tetrodotoxin-pufferfish-blue-ringed-octopus","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Airway protection and mechanical ventilation until the block resolves\nSupportive care; there is no antidote","pitfall":"Ascending paralysis with a completely preserved sensorium, so the patient is aware and terrified throughout — sedate them. Survival is a function of ventilation alone. Recovery is usually complete within 24 hours if the airway was secured in time.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"},{"id":"p-paralytic-shellfish-poisoning-saxitoxin","toxinId":"paralytic-shellfish-poisoning-saxitoxin","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Airway protection and ventilation; supportive care\nNo antidote; symptoms typically resolve within 24 h","pitfall":"Perioral paraesthesia within an hour of eating bivalves during a red tide, progressing to weakness and respiratory paralysis. Cooking does not destroy saxitoxin and the shellfish are not visibly abnormal. Ask about others who ate the same meal.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-04"}];
const TOXIDROMES = [{"id":"cholinergic","name":"Cholinergic","onset":"Minutes to hours","pupils":"Miosis (unreliable — may be normal)","skin":"Wet: diaphoresis, salivation, lacrimation","vitals":"Bradycardia, bronchorrhea, bronchospasm; may be tachycardic from nicotinic effect","mental":"Anxious then depressed; seizures; fasciculations and weakness","tell":"The patient is wet and cannot ventilate. Secretions, not pupils, are the finding that matters.","agents":["Organophosphate insecticides","Nerve agents","Carbamate insecticides","Physostigmine excess","Nicotine","Certain mushrooms (Clitocybe, Inocybe)"],"search":"organophosphate"},{"id":"anticholinergic","name":"Anticholinergic","onset":"30 min to hours; may persist days","pupils":"Mydriasis, poorly reactive","skin":"Dry, flushed, hot — no sweat","vitals":"Tachycardia, hyperthermia, urinary retention, absent bowel sounds","mental":"Agitated delirium, mumbling speech, picking at air, no orientation","tell":"Dry skin and dry axillae. This is the single finding that separates it from a sympathomimetic.","agents":["Diphenhydramine and other antihistamines","Jimson weed (Datura)","Tricyclic antidepressants","Atropine and scopolamine","Antipsychotics","Cyclobenzaprine","Benztropine"],"search":"antimuscarinic"},{"id":"sympathomimetic","name":"Sympathomimetic","onset":"Minutes to hours","pupils":"Mydriasis, reactive","skin":"Diaphoretic — wet","vitals":"Tachycardia, hypertension, hyperthermia","mental":"Agitation, paranoia, hyperalertness; seizures","tell":"Looks like anticholinergic but the patient is soaking wet and has bowel sounds. Sweat is the discriminator.","agents":["Cocaine","Amphetamine and methamphetamine","Synthetic cathinones","MDMA","Pseudoephedrine","Caffeine and theophylline"],"search":"cocaine"},{"id":"opioid","name":"Opioid","onset":"Minutes","pupils":"Miosis (may be normal with meperidine, tramadol, or mixed ingestion)","skin":"Normal to cool","vitals":"Hypoventilation — the defining sign — then bradycardia and hypotension","mental":"Sedation to coma","tell":"Respiratory rate and tidal volume, not pupils. A normal pupil does not exclude it.","agents":["Heroin and fentanyl analogs","Nitazenes","Oxycodone, hydrocodone, morphine","Methadone","Tramadol","Loperamide in massive dose"],"search":"opioid"},{"id":"sedative","name":"Sedative-hypnotic","onset":"Minutes to hours","pupils":"Normal or small, reactive","skin":"Normal","vitals":"Near-normal early; hypoventilation and hypotension when deep","mental":"Sedation to coma with preserved respiratory drive until late","tell":"Sedation without any autonomic signature. If the vitals are unremarkable, think here.","agents":["Benzodiazepines","Alcohol","GHB and 1,4-butanediol","Barbiturates","Zolpidem and Z-drugs","Baclofen"],"search":"benzodiazepines"},{"id":"serotonergic","name":"Serotonin syndrome","onset":"Hours — often within 24 h of a dose change","pupils":"Mydriasis","skin":"Diaphoretic","vitals":"Hyperthermia, tachycardia, hypertension","mental":"Agitation; clonus and hyperreflexia, greater in the legs than the arms; ocular clonus","tell":"Clonus. Rapid onset plus lower-limb-dominant hyperreflexia separates it from neuroleptic malignant syndrome, which builds over days with lead-pipe rigidity and hyporeflexia.","agents":["SSRIs and SNRIs","MAO inhibitors","Linezolid","Methylene blue","Tramadol and meperidine","Triptans","Dextromethorphan"],"search":"serotonin syndrome"},{"id":"nms","name":"Neuroleptic malignant syndrome","onset":"Days to weeks after starting or increasing an antipsychotic","pupils":"Normal","skin":"Diaphoretic, pallor","vitals":"Hyperthermia, autonomic instability, raised creatine kinase","mental":"Stupor and mutism; generalised lead-pipe rigidity with hyporeflexia","tell":"Slow onset and lead-pipe rigidity without clonus. Also consider abrupt withdrawal of levodopa or a dopamine agonist, which produces an identical picture.","agents":["Haloperidol and typical antipsychotics","Atypical antipsychotics","Metoclopramide and prochlorperazine","Withdrawal of levodopa or a dopamine agonist"],"search":"neuroleptic malignant"},{"id":"uncoupler","name":"Metabolic acidosis with hyperventilation","onset":"Variable","pupils":"Normal","skin":"Diaphoretic; hyperthermia if an uncoupler","vitals":"Tachypnoea with a wide anion gap; hyperthermia in uncoupler poisoning","mental":"Tinnitus and agitation early, then confusion and coma","tell":"A patient breathing hard with a wide anion gap and no obvious cause. This is the pattern that gets attributed to sepsis or anxiety until the gas comes back.","agents":["Salicylates","Methanol and ethylene glycol","Metformin","Iron","Cyanide","Dinitrophenol and other uncouplers","Isoniazid"],"search":"salicylates"}];
const VERSION = {"version":"2026.08.23","model":"normalized","toxins":173,"antidoteAgents":77,"protocols":173,"toxidromes":8,"categories":24,"lastReviewed":"2026-08-23","reviewer":"Jae Hyek Choi, MSc, PhD, DVSc","nextReviewDue":"2027-08-23","supplyWatchDue":"2026-11-23","changelog":["Andexanet alfa was withdrawn from the US market on 22 December 2025. The card carried it as an available reversal agent for eight months after that. It is now tier D with the withdrawal stated, and 4F-PCC is named as what is actually left","Ethylene glycol dialysis threshold corrected from 50 mg/dL to 310 mg/dL on an antidote (62 without) — the old figure was EXTRIP's 50 mmol/L with the unit conversion dropped, and it sent patients to dialysis who did not need it","Methanol dialysis criteria corrected to EXTRIP 2015: pH ≤7.15, anion gap >24, coma and seizures added, and the concentration threshold split by whether an alcohol dehydrogenase blocker is running","4-factor PCC dosing now carries the labelled per-INR unit ceilings and the 100 kg dosing-weight limit; the previous text produced 6000 units in a 120 kg patient, a fifth above the label","Succimer is the only FDA-approved oral lead chelator, not the only one — edetate calcium disodium and dimercaprol are approved parenteral agents","Lipid emulsion for local anaesthetic toxicity moved to tier B: no product carries a labelled indication for it. ASRA infusion volume, escalation and continuation rules corrected","Supply reality checked against FDA on 23 August 2026 — Totect discontinued, DTPA procurement route named, the silibinin expanded-access protocol closed in 2020, physostigmine importation still in force, glucagon kit availability corrected","Tier and badge now agree: 33 entries showed 'Antidote available' beside 'Tier —'. Tier N with adjunct agents reads 'No specific antidote · adjuncts only', and the agent card on those entries is labelled 'Adjunct agents'","Background data refresh rebuilt — it validated nothing, reloaded the page, and would have looped forever the moment data/ was published. It now validates, stores, and paints in place"],"expansionPlan":{"target":250,"current":173,"remaining":"Tranche 2 — occupational solvents and metals, antimicrobials, remaining anticonvulsants, ophthalmic and dermatologic exposures, additional plants, veterinary and agricultural products"}};

const $ = i => document.getElementById(i);
const esc = s => String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
/* ---------- persistence: degrades silently where storage is blocked ---------- */
const store = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem("ar."+k)) ?? d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("ar."+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- dataset overlay ----------
   A newer reviewed dataset fetched on an earlier online visit is kept in storage and
   applied here, before the indexes are built. The embedded baseline always renders
   when storage is empty, blocked, or holds anything that fails the gate below. */
(function overlay(){
  try{
    const c=store.get("data",null);
    if(!c||typeof c.version!=="string"||c.version<=VERSION.version) return;
    if(!Array.isArray(c.toxins)||c.toxins.length<50) return;
    if(!Array.isArray(c.agents)||!c.agents.length) return;
    if(!Array.isArray(c.protocols)||c.protocols.length!==c.toxins.length) return;
    TOXINS.length=0; TOXINS.push(...c.toxins);
    AGENTS.length=0; AGENTS.push(...c.agents);
    PROTOCOLS.length=0; PROTOCOLS.push(...c.protocols);
    Object.assign(VERSION,c.meta||{});
  }catch(e){}
})();

let T,A,P;
function reindex(){
  T=Object.fromEntries(TOXINS.map(t=>[t.id,t]));
  A=Object.fromEntries(AGENTS.map(a=>[a.id,a]));
  P=Object.fromEntries(PROTOCOLS.map(p=>[p.toxinId,p]));
}
reindex();
let favs = store.get("favs",[]), recent = store.get("recent",[]);
let WT = store.get("wt",null), HT = store.get("ht",null);

/* ---------- weight resolution ---------- */
const UNIT_RE=/(\d+(?:[.,]\d+)?)\s*(?:[–—-]\s*(\d+(?:[.,]\d+)?)\s*)?(mg|µg|mcg|g|mL|ml|units?|U)\s*\/\s*(kg|m²|m2)(\s*\/\s*(?:h|hr|hour|min|minute|day))?/gi;
const CAP_RE=/\(?\b(?:max(?:imum)?\.?|up to|not to exceed)\s*(\d+(?:[.,]\d+)?)\s*(mg|µg|mcg|g|mL|ml|units?|U)\b/i;
const numv=s=>parseFloat(String(s).replace(",",""));
const toB=(v,u)=>{const k=u.toLowerCase();return k==="g"?v*1000:(k==="µg"||k==="mcg")?v/1000:v;};
const frB=(v,u)=>{const k=u.toLowerCase();return k==="g"?v/1000:(k==="µg"||k==="mcg")?v*1000:v;};
const tidy=v=>!isFinite(v)?"—":v>=100?Math.round(v).toLocaleString():v>=10?(Math.round(v*10)/10)+"":(Math.round(v*100)/100)+"";
const bsa=()=>(WT&&HT)?Math.sqrt((HT*WT)/3600):null;

function computeDoses(text){
  if(!WT) return null;
  const rows=[],seen=new Set(); let m; UNIT_RE.lastIndex=0;
  while((m=UNIT_RE.exec(text))!==null){
    const [full,lo,hi,unit,per,rate]=m;
    if(seen.has(full)) continue; seen.add(full);
    let factor;
    if(per.toLowerCase()==="kg") factor=WT;
    else { const b=bsa(); if(!b){ rows.push({expr:full,out:null,note:"needs a height for body surface area"}); continue; } factor=b; }
    let a=toB(numv(lo),unit)*factor, b2=hi?toB(numv(hi),unit)*factor:null;
    const tail=text.slice(m.index,m.index+full.length+40), cap=tail.match(CAP_RE);
    let capped=false,capTxt="";
    if(cap){ const cv=toB(numv(cap[1]),cap[2]);
      if(a>cv||(b2&&b2>cv)){capped=true;capTxt=cap[1]+" "+cap[2];}
      a=Math.min(a,cv); if(b2) b2=Math.min(b2,cv); }
    const u=(unit.toLowerCase().startsWith("unit")||unit==="U")?"units":unit;
    const shown=(b2&&b2!==a)?tidy(frB(a,u))+"–"+tidy(frB(b2,u))+" "+u:tidy(frB(a,u))+" "+u;
