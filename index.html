<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0E12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>TOXCARD — Antidote Reference</title>
<style>
:root{
  --bg:#0A0E12; --surf:#131A20; --surf2:#1A232A; --line:#25313A;
  --tx:#E8EEF2; --mut:#8A9AA6; --dim:#5F707C;
  --sig:#E5473C; --teal:#2FB3A8; --amber:#D9A441; --ok:#4FBF87;
  --tA:#2FB3A8; --tB:#3E8F97; --tC:#D9A441; --tD:#7C8A93; --tN:#5F707C;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
[data-theme="light"]{
  --bg:#EDF0F2; --surf:#FFFFFF; --surf2:#F4F7F8; --line:#D3DBDF;
  --tx:#10161A; --mut:#5A6B75; --dim:#8394A0;
  --sig:#B3261E; --teal:#0B6F68; --amber:#8A5A00; --ok:#1E7A4E;
  --tA:#0B6F68; --tB:#3D7A80; --tC:#8A5A00; --tD:#6B7880; --tN:#8394A0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font-family:inherit}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .35s ease}
#splash.gone{opacity:0;pointer-events:none}
#splash svg{width:88px;height:88px}
#splash h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
#splash p{margin:0;color:var(--sig);font-size:11.5px;letter-spacing:.24em;text-transform:uppercase}
#splash .cred{position:absolute;bottom:calc(34px + var(--safe-b));color:var(--dim);font-size:11.5px}

/* ---------- chrome ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--bg);
  padding:calc(10px + var(--safe-t)) 16px 10px;border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:12px;min-height:34px}
.top h2{margin:0;font-size:19px;font-weight:750;letter-spacing:-.01em;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{font-size:15px;color:var(--teal);display:flex;align-items:center;gap:4px;padding:4px 2px}
.iconbtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:9px;color:var(--mut);font-size:15px}
.iconbtn.on{color:var(--amber);border-color:var(--amber)}

main{padding:16px 16px calc(84px + var(--safe-b));max-width:760px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* ---------- search ---------- */
.search{display:flex;align-items:center;gap:9px;background:var(--surf);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;margin-bottom:16px}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font-size:16px;outline:0}
.search input::placeholder{color:var(--dim)}
.search .mag{color:var(--dim);font-size:15px}

/* ---------- tiles ---------- */
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  margin:22px 0 10px;font-family:ui-monospace,Menlo,monospace}
.lbl:first-child{margin-top:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:14px 12px;
  text-align:left;display:flex;flex-direction:column;gap:7px;min-height:104px}
.tile .ic{font-size:19px;line-height:1}
.tile b{font-size:13px;font-weight:700;line-height:1.25}
.tile span{font-size:11.5px;color:var(--mut);line-height:1.35}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.tiles.two .tile{min-height:auto;flex-direction:row;align-items:center;gap:11px}

/* ---------- rows ---------- */
.row-item{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);
  border-radius:11px;padding:12px 13px;margin-bottom:7px;width:100%;text-align:left}
.row-item .tier{flex:0 0 auto;width:22px;height:22px;border-radius:6px;display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#06090B;
  font-family:ui-monospace,Menlo,monospace}
.row-item .txt{flex:1;min-width:0}
.row-item .txt b{display:block;font-size:14.5px;font-weight:650;line-height:1.3}
.row-item .txt span{display:block;font-size:12px;color:var(--mut);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-item .car{color:var(--dim);font-size:15px}
.empty{text-align:center;color:var(--mut);padding:44px 12px;font-size:14.5px}

/* ---------- chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;min-height:44px;display:inline-flex;align-items:center;
  border:1px solid var(--line);border-radius:999px;
  font-size:12.5px;color:var(--mut);background:var(--surf);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}

/* ---------- detail ---------- */
.hero{display:flex;gap:13px;align-items:flex-start;margin-bottom:16px}
.hero .glyph{flex:0 0 auto;width:58px;height:58px;border-radius:14px;display:flex;
  align-items:center;justify-content:center;font-size:25px}
.hero h3{margin:0 0 5px;font-size:20px;font-weight:750;letter-spacing:-.01em;line-height:1.2}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.badge.sig{color:var(--sig);border-color:var(--sig)}
.badge.teal{color:var(--teal);border-color:var(--teal)}
.badge.amber{color:var(--amber);border-color:var(--amber)}

.card{background:var(--surf);border:1px solid var(--line);border-radius:13px;
  padding:14px 15px;margin-bottom:11px}
.card h4{margin:0 0 9px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-weight:700}
.card p{margin:0;font-size:14.5px;line-height:1.55}
.card.pit{border-color:var(--sig);background:color-mix(in srgb,var(--sig) 9%,var(--surf))}
.card.pit h4{color:var(--sig)}
.card.win{border-color:var(--sig)}
.card.win h4{color:var(--sig)}
.card.win p{font-weight:600}

.dose{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;margin:0}
.calc{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.calc .hd{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);
  font-family:ui-monospace,Menlo,monospace;font-weight:700;margin-bottom:6px}
.calc ul{margin:0;padding-left:16px;font-size:13px;line-height:1.65}
.calc b{font-family:ui-monospace,Menlo,monospace}
.calc .cap{color:var(--sig)}
.calc .warn{margin-top:7px;font-size:11.5px;color:var(--sig);line-height:1.45}

.linkrow{display:flex;flex-wrap:wrap;gap:7px}
.linkrow button{padding:8px 12px;border:1px solid var(--teal);border-radius:9px;
  font-size:13px;color:var(--teal)}
.srcline{font-size:12px;color:var(--mut);line-height:1.75}
.srcline .st{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:9px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--bg);background:var(--dim);
  padding:1px 5px;border-radius:4px;margin-right:6px;vertical-align:1px}

/* ---------- tools ---------- */
.wt{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.wt input{width:88px;padding:10px 11px;background:var(--surf2);border:1px solid var(--line);
  border-radius:9px;color:var(--tx);font-size:16px;font-family:ui-monospace,Menlo,monospace}
.wt label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  font-family:ui-monospace,Menlo,monospace}
.hint{font-size:12.5px;color:var(--mut);margin-top:10px}
.txgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.txgrid button{padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:13.5px;text-align:left;background:var(--surf);line-height:1.3}
.txgrid button[aria-pressed="true"]{border-color:var(--teal);color:var(--teal)}
.kv{display:grid;grid-template-columns:74px 1fr;gap:5px 11px;font-size:13.5px}
.kv dt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  font-family:ui-monospace,Menlo,monospace;padding-top:3px}
.kv dd{margin:0}

/* ---------- alerts ---------- */
.alert{background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--amber);
  border-radius:11px;padding:12px 14px;margin-bottom:8px;font-size:13.5px;line-height:1.5}
.alert .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);
  font-family:ui-monospace,Menlo,monospace;display:block;margin-bottom:5px}

/* ---------- tab bar ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surf);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:var(--safe-b)}
nav button{padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--dim);font-size:10px;letter-spacing:.03em}
nav button .ic{font-size:17px;line-height:1}
nav button[aria-current="page"]{color:var(--teal)}

.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--dim);line-height:1.7}
@media (min-width:620px){ .txgrid{grid-template-columns:repeat(3,1fr)} }
</style>
</head>

const PROTOCOLS = [{"id":"p-001-acetaminophen-paracetamol","toxinId":"001-acetaminophen-paracetamol","antidoteIds":["acetylcysteine"],"tier":"A","agentLine":"Acetylcysteine (NAC)","dose":"IV 21-h: 150 mg/kg over 1 h → 50 mg/kg over 4 h → 100 mg/kg over 16 h\nIV 2-bag: 200 mg/kg over 4 h → 100 mg/kg over 16 h\nPO: 140 mg/kg load → 70 mg/kg q4h × 17","pitfall":"Twenty-one hours is a starting point, not a stop sign. Continue until acetaminophen is undetectable, INR < 2, and transaminases are falling. Anaphylactoid reactions during the loading infusion are rate-related histamine release, not allergy — slow the rate, give an antihistamine, and keep going.","window":"Full hepatoprotection if started within 8 h of ingestion","sources":[{"label":"Acetadote prescribing information","type":"FDA label"},{"label":"Expert consensus on acetaminophen poisoning, 2023","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-002-massive-acetaminophen-ingestion-500-mg-kg-or-4-h-level-far-a","toxinId":"002-massive-acetaminophen-ingestion-500-mg-kg-or-4-h-level-far-a","antidoteIds":["fomepizole","hemodialysis"],"tier":"C","agentLine":"Fomepizole + hemodialysis, added to NAC","dose":"Fomepizole 15 mg/kg IV × 1 (CYP2E1 inhibition)\nIntermittent HD clears both APAP and NAC — increase NAC rate during dialysis","pitfall":"These patients crash within 12 hours with lactic acidosis and shock before any hepatic injury appears. Waiting for the transaminases to rise means waiting too long.","window":"","sources":[{"label":"Expert consensus on acetaminophen poisoning, 2023","type":"Consensus"},{"label":"Fomepizole in massive overdose, Clin Toxicol case series","type":"Literature"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-003-salicylates-aspirin-oil-of-wintergreen","toxinId":"003-salicylates-aspirin-oil-of-wintergreen","antidoteIds":["bicarbonate","hemodialysis"],"tier":"B","agentLine":"Sodium bicarbonate + hemodialysis","dose":"150 mEq NaHCO₃ in 1 L D5W at 1.5–2× maintenance; target urine pH 7.5–8.0\nReplete potassium aggressively — alkaluria fails without it\nHD for salicylate >100 mg/dL (>90 with impaired kidney function), altered mental status, ARDS needing oxygen, or standard therapy failing\nAlso consider at >90 mg/dL (>80 if impaired) or pH ≤7.20 — intermittent HD is the preferred modality","pitfall":"Do not intubate casually. These patients are surviving on a massive minute ventilation; the apneic period of RSI and any subsequent under-ventilation on the vent causes a fatal drop in pH. If intubation is unavoidable, match their pre-intubation minute ventilation and give bicarbonate through the procedure. Give dextrose regardless of serum glucose — CNS glucose is low when serum is normal. Do not wait for a number. Most salicylate deaths peaked below 100 mg/dL, and coma or seizures are an indication to dialyse whatever the level says.","window":"","sources":[{"label":"EXTRIP workgroup, salicylate, Ann Emerg Med 2015;66:165-81 (PMID 25986310)","type":"Consensus"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-004-nsaids","toxinId":"004-nsaids","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Supportive care; monitor renal function, GI bleeding, and electrolytes","pitfall":"Massive ibuprofen ingestion can cause seizures and metabolic acidosis. Charcoal early is the only meaningful intervention.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-005-opioids-respiratory-depression","toxinId":"005-opioids-respiratory-depression","antidoteIds":["naloxone"],"tier":"A","agentLine":"Naloxone","dose":"IV 0.04–0.4 mg titrated to respiration, not to consciousness\nOpioid-dependent: start 0.04 mg to avoid precipitated withdrawal\nIN 2–4 mg; IM 0.4 mg\nInfusion: two-thirds of the arousal dose per hour","pitfall":"Naloxone lasts 20 to 90 minutes; almost every opioid lasts longer. The recurrence, not the initial reversal, is what kills. With fentanyl analogs and nitazenes, apparent 'naloxone resistance' is nearly always inadequate bag-mask ventilation rather than a pharmacologic failure — ventilate first. Buprenorphine reversal is incomplete at any dose.","window":"","sources":[{"label":"Naloxone prescribing information","type":"FDA label"},{"label":"AHA 2023 focused update: cardiac arrest in toxicity","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-006-opioid-overdose-community-and-ems-setting","toxinId":"006-opioid-overdose-community-and-ems-setting","antidoteIds":["nalmefene"],"tier":"B","agentLine":"Nalmefene nasal spray (Opvee)","dose":"2.7 mg intranasal, one spray in one nostril; repeat q2–5 min with a new device as needed\nFDA-approved May 2023, age ≥12 y","pitfall":"The long half-life that makes it attractive also produces protracted withdrawal and blocks opioid analgesia for hours. That complicates pain control and buprenorphine induction in the same patient later that day.","window":"","sources":[{"label":"Opvee prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-007-clonidine-tizanidine-imidazoline-decongestants","toxinId":"007-clonidine-tizanidine-imidazoline-decongestants","antidoteIds":["naloxone"],"tier":"C","agentLine":"Naloxone (high dose, inconsistent)","dose":"Naloxone 2–10 mg IV; response is unpredictable\nAtropine for symptomatic bradycardia; fluids and vasopressors for hypotension","pitfall":"Most cases need nothing but observation and airway support. Do not escalate naloxone indefinitely chasing a response that may never come.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-008-benzodiazepines","toxinId":"008-benzodiazepines","antidoteIds":["flumazenil"],"tier":"C","agentLine":"Flumazenil — narrow indication only","dose":"0.1–0.2 mg IV over 30 s, repeat to a maximum of ~1 mg\nDuration 30–60 min — resedation is expected","pitfall":"Contraindicated with chronic benzodiazepine use, any seizure history, head injury, and co-ingestion of a proconvulsant — tricyclics above all. In an unknown overdose you cannot exclude these, so you cannot give it. Flumazenil-induced seizures are refractory to benzodiazepines and require barbiturates or propofol. Isolated benzodiazepine overdose has a very low mortality; the risk-benefit rarely favors reversal.","window":"","sources":[{"label":"Flumazenil prescribing information","type":"FDA label"},{"label":"AHA 2023 focused update: cardiac arrest in toxicity","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-009-remimazolam-procedural-sedation","toxinId":"009-remimazolam-procedural-sedation","antidoteIds":["flumazenil"],"tier":"B","agentLine":"Flumazenil","dose":"0.2 mg IV, repeat q1 min to 1 mg total","pitfall":"This is the legitimate use case — a benzodiazepine-naive patient, a known agent, a controlled setting. Even here, routine reversal is not recommended because of rebound sedation.","window":"","sources":[{"label":"Byfavo prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-010-ghb-gbl-1-4-butanediol","toxinId":"010-ghb-gbl-1-4-butanediol","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Airway management and observation; most wake abruptly at 2–4 h","pitfall":"The classic error is intubating a patient who was about to wake up on their own, then extubating into agitation. Watch, do not reverse.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-011-baclofen-overdose","toxinId":"011-baclofen-overdose","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Supportive; hemodialysis in renal impairment\nIntrathecal pump: interrogate the device","pitfall":"Baclofen overdose mimics brain death — fixed pupils, absent reflexes, flat EEG — and recovers fully. Do not make prognostic decisions or organ-donation determinations on this presentation. Abrupt withdrawal is a separate emergency: restart baclofen, benzodiazepines are inadequate alone.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-012-unfractionated-heparin","toxinId":"012-unfractionated-heparin","antidoteIds":["protamine"],"tier":"A","agentLine":"Protamine sulfate","dose":"1 mg per 100 units of heparin given in the preceding 2–3 h\nMaximum 50 mg per dose; infuse over 10 min","pitfall":"Rapid infusion causes hypotension, bradycardia, and anaphylactoid reactions — higher risk with prior protamine exposure, NPH insulin use, vasectomy, or fish allergy. Excess protamine is itself an anticoagulant, so overshooting makes bleeding worse.","window":"","sources":[{"label":"Protamine sulfate prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-013-low-molecular-weight-heparin-enoxaparin-dalteparin","toxinId":"013-low-molecular-weight-heparin-enoxaparin-dalteparin","antidoteIds":["protamine"],"tier":"B","agentLine":"Protamine sulfate — partial reversal only","dose":"1 mg protamine per 1 mg enoxaparin if given within 8 h; 0.5 mg/mg if 8–12 h\nDalteparin is dosed per anti-Xa unit instead: 1 mg protamine per 100 IU, then 0.5 mg per 100 IU\nReverses roughly 60% of anti-Xa activity and never all of it","pitfall":"Complete reversal is not achievable. Do not assume a normal aPTT means the patient is no longer anticoagulated — follow anti-Xa where available.","window":"Protamine most effective within 8 h of the LMWH dose","sources":[{"label":"Lovenox prescribing information","type":"FDA label"},{"label":"Protamine sulfate prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-014-fondaparinux","toxinId":"014-fondaparinux","antidoteIds":[],"tier":"D","agentLine":"No established reversal","dose":"Consider aPCC (FEIBA) 20 U/kg — weakly supported. Andexanet alfa was withdrawn from the US market 22 Dec 2025 and is no longer an option","pitfall":"Half-life 17–21 hours and not dialyzable. Plan for supportive transfusion and time rather than reversal.","window":"","sources":[{"label":"Arixtra prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-015-warfarin-and-other-vitamin-k-antagonists","toxinId":"015-warfarin-and-other-vitamin-k-antagonists","antidoteIds":["vitamin-k","pcc"],"tier":"A","agentLine":"Vitamin K₁ (phytonadione) + 4-factor PCC","dose":"Major bleeding: 4F-PCC banded by pre-treatment INR — 2 to <4: 25 U/kg, max 2500 U · 4–6: 35 U/kg, max 3500 U · >6: 50 U/kg, max 5000 U\nDose on actual body weight up to 100 kg only; above that, 100 kg is the dosing weight\nPlus vitamin K₁ 10 mg IV over 20–30 min, no faster than 1 mg/min\nNo bleeding, INR 4.5–10: hold, ± vitamin K₁ 1–2.5 mg PO\nSupratherapeutic INR >10 without bleeding: vitamin K₁ 2.5–5 mg PO","pitfall":"Vitamin K alone takes 6 to 24 hours for full effect — it is never sole therapy in major bleeding. PCC provides the factors, vitamin K keeps them from disappearing again once PCC clears in 6 hours. FFP requires large volumes and works slower. Dilute IV vitamin K and give it slowly: anaphylactoid reactions are rare but real. The per-band unit ceilings are not rounding guidance. A 120 kg patient at INR 7.2 comes to 6000 units on a naive per-kilogram calculation — a fifth above the labelled maximum, on a weight the label forbids using — and 4F-PCC overdose is thrombotic.","window":"","sources":[{"label":"Kcentra prescribing information, rev. 5/2023","type":"FDA label"},{"label":"Neurocritical Care Society reversal guideline","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-016-superwarfarins-brodifacoum-bromadiolone-rodenticide-adultera","toxinId":"016-superwarfarins-brodifacoum-bromadiolone-rodenticide-adultera","antidoteIds":["vitamin-k"],"tier":"B","agentLine":"High-dose oral vitamin K₁, prolonged","dose":"25–100 mg PO daily, titrated to INR; often required for weeks to months\nPCC for acute bleeding","pitfall":"The half-life runs to weeks. Stopping vitamin K when the INR normalizes leads to delayed, sometimes fatal, rebound coagulopathy. Patients need a defined taper with serial INRs and reliable follow-up, and cost or access failure is a common cause of relapse.","window":"","sources":[{"label":"MMWR, brodifacoum-adulterated synthetic cannabinoid outbreak, 2018","type":"CDC"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-017-dabigatran-pradaxa","toxinId":"017-dabigatran-pradaxa","antidoteIds":["idarucizumab","hemodialysis"],"tier":"A","agentLine":"Idarucizumab (Praxbind)","dose":"5 g IV as two consecutive 2.5 g/50 mL vials, no more than 15 min apart\nNo renal dose adjustment; restart dabigatran at 24 h if hemostasis achieved","pitfall":"With massive ingestion or renal failure, redistribution can cause rebound anticoagulation — recheck a dilute thrombin time or ecarin clotting time and be prepared to redose. Unlike the factor Xa inhibitors, dabigatran is substantially dialyzable, which is a genuine second option.","window":"","sources":[{"label":"Praxbind prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-018-apixaban-rivaroxaban-life-threatening-bleeding","toxinId":"018-apixaban-rivaroxaban-life-threatening-bleeding","antidoteIds":["andexanet","pcc"],"tier":"D","agentLine":"Andexanet alfa withdrawn — 4F-PCC is what is left","dose":"Andexanet alfa (Andexxa): WITHDRAWN from the US market 22 Dec 2025 — BLA voluntarily withdrawn. Not obtainable; do not stock.\n4F-PCC 50 U/kg is the remaining option — off-label, since Kcentra is approved for vitamin K antagonist reversal only\nTranexamic acid, transfusion support, and source control as for any life-threatening bleed\nActivated charcoal if the ingestion was within 2 h; neither drug is dialysable","pitfall":"The antidote is gone. FDA judged the risks to outweigh the benefits and the licence was withdrawn on 22 December 2025; the final 30-day analysis of all 530 ANNEXA-I patients put thrombosis at 14.6% against 6.9% and thrombotic death at 2.5% against 0.9%, well above the 10.3% against 5.6% reported at interim. Any protocol, order set, or wall chart in your department that still names andexanet needs to be pulled. The ISTH guidance that ranks the options was written while the drug still existed, so it reads as though a choice remains — there is none.","window":"","sources":[{"label":"FDA, Update: Safety of Andexxa — US market withdrawal 22 Dec 2025","type":"FDA label"},{"label":"ANNEXA-I, N Engl J Med 2024;390:1745-55 (PMID 38749032)","type":"Trial"},{"label":"ISTH SSC guidance on FXa inhibitor reversal, 2024 (PMID 39029742)","type":"Guideline"},{"label":"Kcentra prescribing information, rev. 5/2023","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-019-edoxaban-betrixaban","toxinId":"019-edoxaban-betrixaban","antidoteIds":["pcc"],"tier":"D","agentLine":"4F-PCC — no approved reversal agent exists","dose":"4F-PCC 50 U/kg is the only choice. Andexanet alfa was never approved for these agents and was withdrawn from the US market 22 Dec 2025","pitfall":"Label limitations here reflect absent data, not proven ineffectiveness — but they do mean you are improvising. Document the reasoning.","window":"","sources":[{"label":"Andexxa prescribing information — indication limits","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-020-ticagrelor-brilinta","toxinId":"020-ticagrelor-brilinta","antidoteIds":["bentracimab"],"tier":"D","agentLine":"Bentracimab — investigational, BLA under FDA review","dose":"Not approved as of August 2026 — the last documented FDA action is BLA acceptance with priority review on 2 Aug 2024; no outcome has been published since. REVERSE-IT showed reversal within 5–10 min of infusion start\nCurrent practice: platelet transfusion (largely ineffective), antifibrinolytics, supportive transfusion","pitfall":"Platelet transfusion fails with ticagrelor specifically, because the drug is reversibly bound and circulating — transfused platelets are inhibited within minutes. That distinguishes it from clopidogrel and prasugrel.","window":"","sources":[{"label":"REVERSE-IT trial","type":"Trial"},{"label":"SERB BLA under FDA review — not approved","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-021-clopidogrel-prasugrel","toxinId":"021-clopidogrel-prasugrel","antidoteIds":["platelets"],"tier":"C","agentLine":"Platelet transfusion ± desmopressin","dose":"1–2 apheresis units; DDAVP 0.3 µg/kg IV","pitfall":"These bind irreversibly, so transfused platelets work — the opposite of ticagrelor. Evidence for benefit in intracranial hemorrhage is poor and the PATCH trial suggested harm in spontaneous ICH.","window":"","sources":[{"label":"PATCH trial, Lancet 2016","type":"Trial"},{"label":"Neurocritical Care Society reversal guideline","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-022-thrombolytics-alteplase-tenecteplase-symptomatic-ich","toxinId":"022-thrombolytics-alteplase-tenecteplase-symptomatic-ich","antidoteIds":["cryo"],"tier":"C","agentLine":"Cryoprecipitate + antifibrinolytic","dose":"Cryoprecipitate 10 units (target fibrinogen >150 mg/dL)\nTranexamic acid 1 g IV or aminocaproic acid 4–5 g IV over 1 h","pitfall":"Stop the infusion first, then send a fibrinogen, then treat — but do not wait for the result before giving cryoprecipitate in a deteriorating patient.","window":"","sources":[{"label":"AHA/ASA acute ischemic stroke guideline","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-023-digoxin-and-cardiac-glycosides-oleander-foxglove-lily-of-the","toxinId":"023-digoxin-and-cardiac-glycosides-oleander-foxglove-lily-of-the","antidoteIds":["digifab"],"tier":"A","agentLine":"Digoxin immune Fab (DigiFab)","dose":"Acute, unknown amount: 10 vials, then a further 10 if needed (staged, per label, to limit febrile reaction); 20 vials in arrest\nKnown level: vials = (serum digoxin ng/mL × weight kg) ÷ 100\nKnown ingested dose: vials = (mg ingested × 0.8) ÷ 0.5 mg bound per vial\nChronic toxicity: 3–6 vials; small children <20 kg often 1 vial","pitfall":"Digibind is discontinued in the US — the vial math differs, so use DigiFab figures. After Fab, potassium shifts back intracellularly and can drop precipitously; monitor closely and do not over-treat the initial hyperkalemia. Calcium in digoxin toxicity remains widely avoided. Total digoxin assays become uninterpretable for days once Fab is on board.","window":"","sources":[{"label":"DigiFab prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-024-beta-blocker-overdose","toxinId":"024-beta-blocker-overdose","antidoteIds":["glucagon"],"tier":"C","agentLine":"Glucagon","dose":"3–5 mg IV bolus over 1–2 min, up to 10 mg; if it works, infuse 2–5 mg/h\nPre-treat with an antiemetic","pitfall":"Vomiting in an obtunded patient is the main hazard. Hospital stock is usually a few milligrams, far short of what an infusion consumes, so call pharmacy early. Only Lilly's branded kit was discontinued in 2022; several labelers still market 1 mg kits usable IV, and Gvoke VialDx is a ready-to-use IV vial. Dasiglucagon and nasal glucagon are fixed-dose and subcutaneous or intranasal only — neither is usable here. Evidence is weaker than the textbooks imply; do not delay high-dose insulin waiting to see if glucagon works.","window":"","sources":[{"label":"AHA 2023 focused update: cardiac arrest in toxicity","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-025-beta-blocker-or-calcium-channel-blocker-cardiogenic-shock","toxinId":"025-beta-blocker-or-calcium-channel-blocker-cardiogenic-shock","antidoteIds":["insulin-hiet"],"tier":"B","agentLine":"High-dose insulin euglycemia therapy (HIET)","dose":"Regular insulin 1 U/kg IV bolus, then 1 U/kg/h titrated up to 10 U/kg/h\nDextrose infusion (D10 or D50) to hold glucose 100–250 mg/dL\nPotassium to keep K 2.8–3.2 mEq/L","pitfall":"Onset takes 15 to 60 minutes, so start it early — before you have escalated to catastrophic vasopressor doses, not after. Hypoglycemia and hypokalemia persist for hours after the insulin is stopped, so glucose monitoring continues well past the infusion.","window":"","sources":[{"label":"AHA 2023 focused update: cardiac arrest in toxicity","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-026-calcium-channel-blocker-overdose","toxinId":"026-calcium-channel-blocker-overdose","antidoteIds":["calcium"],"tier":"B","agentLine":"Calcium salts","dose":"Calcium chloride 10–20 mL of 10% via central line, or calcium gluconate 30–60 mL of 10% peripherally\nRepeat q10–20 min; infusion may be required","pitfall":"Response is often transient and incomplete — calcium buys time for HIET, it does not substitute for it. Central access is preferred for chloride because extravasation causes necrosis. Sustained-release verapamil and diltiazem present late and deteriorate suddenly; whole bowel irrigation matters here.","window":"","sources":[{"label":"AHA 2023 focused update: cardiac arrest in toxicity","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-027-refractory-poison-induced-cardiogenic-shock","toxinId":"027-refractory-poison-induced-cardiogenic-shock","antidoteIds":["lipid","ecmo"],"tier":"C","agentLine":"IV lipid emulsion, then VA-ECMO","dose":"20% lipid emulsion 1.5 mL/kg bolus, may repeat\nEarly ECMO consultation for refractory shock or arrest with a recoverable toxin","pitfall":"ECMO has the best outcome data of anything in this scenario and needs to be considered before the patient is unsalvageable. Lipid emulsion interferes with laboratory assays and can foul an ECMO oxygenator — flag it to the perfusionist.","window":"","sources":[{"label":"AHA 2023 focused update: cardiac arrest in toxicity","type":"Guideline"},{"label":"ACMT/AACT lipid emulsion workgroup recommendations, Clin Toxicol 2016","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-028-tricyclic-antidepressants-and-sodium-channel-blockade-qrs-10","toxinId":"028-tricyclic-antidepressants-and-sodium-channel-blockade-qrs-10","antidoteIds":["bicarbonate"],"tier":"B","agentLine":"Sodium bicarbonate","dose":"1–2 mEq/kg IV bolus, repeat until QRS narrows\nInfusion: 150 mEq in 1 L D5W; target serum pH 7.50–7.55 and QRS under 100 ms — both are toxicology endpoints, not AHA ones\nHypertonic saline 3% only as a refractory adjunct when already alkalotic — no guideline endorses it and the evidence is animal and case-report\nMonitor sodium, potassium, chloride and pH — large bicarbonate loads cause hypernatremia and hypokalemia","pitfall":"The sodium load is the therapy, not the alkalosis alone. Avoid class IA, IC, and III antiarrhythmics entirely. Physostigmine is contraindicated. Hypotension responds to sodium and norepinephrine, not to more fluid. A terminal R wave in aVR > 3 mm predicts seizures and dysrhythmia.","window":"","sources":[{"label":"AHA 2023 focused update: cardiac arrest in toxicity","type":"Guideline"},{"label":"EXTRIP Workgroup, tricyclic antidepressants","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-029-bupropion-diphenhydramine-cocaine-flecainide-wide-complex-to","toxinId":"029-bupropion-diphenhydramine-cocaine-flecainide-wide-complex-to","antidoteIds":["bicarbonate","lipid","ecmo"],"tier":"C","agentLine":"Sodium bicarbonate; lipid emulsion; ECMO","dose":"NaHCO₃ 1–2 mEq/kg boluses; benzodiazepines for seizures\nBupropion: expect delayed seizures from XL formulations up to 24 h","pitfall":"Bupropion causes seizures before cardiotoxicity and the extended-release preparations delay both — a well-appearing patient at 6 hours is not cleared. Never give beta-blockers in cocaine toxicity while the sympathomimetic surge is active.","window":"","sources":[{"label":"AHA 2023 focused update: cardiac arrest in toxicity","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-030-qt-prolongation-and-torsades-de-pointes-sotalol-methadone-ar","toxinId":"030-qt-prolongation-and-torsades-de-pointes-sotalol-methadone-ar","antidoteIds":["magnesium"],"tier":"B","agentLine":"Magnesium sulfate","dose":"2 g IV over 1–2 min, repeat; infusion 3–20 mg/min\nOverdrive pacing at 90–110 bpm, or isoproterenol, if torsades recurs\nCorrect potassium to 4.5–5.0","pitfall":"Magnesium terminates torsades without shortening the QT — recurrence is expected until the underlying drug clears or the rate is increased. Amiodarone and procainamide make this worse.","window":"","sources":[{"label":"AHA advanced cardiovascular life support","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-031-methemoglobinemia-benzocaine-dapsone-nitrites-aniline-dyes-n","toxinId":"031-methemoglobinemia-benzocaine-dapsone-nitrites-aniline-dyes-n","antidoteIds":["methylene-blue"],"tier":"A","agentLine":"Methylene blue","dose":"1–2 mg/kg IV over 5 min; may repeat once at 1 h\nTreat if MetHb >20–30%, or >10% with cardiopulmonary disease or symptoms","pitfall":"Absolutely contraindicated in G6PD deficiency — it causes hemolysis and paradoxically worsens the methemoglobinemia; use ascorbic acid, exchange transfusion, or hyperbaric oxygen instead. Methylene blue is a potent MAO-A inhibitor and precipitates serotonin syndrome with SSRIs and SNRIs. Cumulative doses above 7 mg/kg induce methemoglobinemia themselves. Pulse oximetry is unreliable — get co-oximetry.","window":"","sources":[{"label":"ProvayBlue prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-032-dapsone-induced-methemoglobinemia-specifically","toxinId":"032-dapsone-induced-methemoglobinemia-specifically","antidoteIds":["methylene-blue","cimetidine","charcoal"],"tier":"C","agentLine":"Methylene blue + cimetidine + multi-dose activated charcoal","dose":"Methylene blue 1–2 mg/kg (confirm G6PD status first); cimetidine 400 mg PO TID; MDAC 25 g q4h","pitfall":"Dapsone's half-life is 30 hours and its hydroxylamine metabolite keeps regenerating methemoglobin. A single dose of methylene blue produces a rebound at 6 to 12 hours; anticipate it and admit.","window":"","sources":[{"label":"ProvayBlue prescribing information","type":"FDA label"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-033-refractory-vasoplegic-shock-post-bypass-ace-inhibitor-sepsis","toxinId":"033-refractory-vasoplegic-shock-post-bypass-ace-inhibitor-sepsis","antidoteIds":["methylene-blue","hydroxocobalamin"],"tier":"C","agentLine":"Methylene blue or hydroxocobalamin","dose":"Methylene blue 1–2 mg/kg IV over 20 min, then 0.5 mg/kg/h\nHydroxocobalamin 5 g IV when methylene blue is contraindicated","pitfall":"Same G6PD and serotonergic contraindications apply. Hydroxocobalamin discolours the plasma and skin deep red, which invalidates co-oximetry and many colorimetric assays for 24 to 48 hours.","window":"","sources":[{"label":"Off-label; case series and narrative reviews","type":"Literature"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-034-methanol-windshield-fluid-moonshine-adulterated-spirits","toxinId":"034-methanol-windshield-fluid-moonshine-adulterated-spirits","antidoteIds":["fomepizole","hemodialysis"],"tier":"A","agentLine":"Fomepizole + folinic acid + hemodialysis","dose":"Fomepizole 15 mg/kg IV load, then 10 mg/kg q12h × 4 doses, then 15 mg/kg q12h\nDuring hemodialysis: dose q4h\nFolinic acid (or folate) 50 mg IV q6h\nHD for coma, seizures, new visual deficits, pH ≤7.15, anion gap >24 mmol/L, impaired kidney function, or methanol >70 mg/dL on fomepizole (>60 on ethanol, >50 if no blocker)","pitfall":"Fomepizole blocks further formate production but removes nothing already formed. A patient with visual loss or acidosis needs dialysis, not just the antidote. Do not be reassured by a small osmolal gap late in the course — by then the alcohol has become the acid.","window":"","sources":[{"label":"Antizol prescribing information","type":"FDA label"},{"label":"EXTRIP workgroup, methanol, Crit Care Med 2015;43:461-72 (PMID 25493973)","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-035-ethylene-glycol-antifreeze","toxinId":"035-ethylene-glycol-antifreeze","antidoteIds":["fomepizole","pyridoxine","hemodialysis"],"tier":"A","agentLine":"Fomepizole + thiamine + pyridoxine + hemodialysis","dose":"Fomepizole dosing as for methanol\nThiamine 100 mg IV q6h; pyridoxine 100 mg IV q6h\nHD for coma, seizures, AKI, anion gap >27 mmol/L, glycolate >12 mmol/L, or ethylene glycol >310 mg/dL on fomepizole (>62 mg/dL if no antidote)","pitfall":"Calcium oxalate crystalluria and hypocalcemia are hallmarks. Resist giving calcium unless the patient is symptomatic or has ECG changes — it drives further oxalate precipitation. Urine fluorescence under Wood's lamp is neither sensitive nor specific and should not guide decisions. The dialysis threshold is a unit trap: EXTRIP states 50 mmol/L, which is 310 mg/dL, not 50 mg/dL. On fomepizole with preserved kidney function and pH, patients do well at almost any concentration, and dialysing on the lower number treats the number rather than the patient.","window":"","sources":[{"label":"Antizol prescribing information","type":"FDA label"},{"label":"EXTRIP workgroup, ethylene glycol, Crit Care 2023;27:56 (PMID 36765419)","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-036-diethylene-glycol-contaminated-syrups-glycerin-substitution","toxinId":"036-diethylene-glycol-contaminated-syrups-glycerin-substitution","antidoteIds":["fomepizole","hemodialysis"],"tier":"C","agentLine":"Fomepizole + early hemodialysis","dose":"Fomepizole as for methanol; dialyze early and aggressively","pitfall":"The signature injury is delayed acute kidney failure and then a progressive, often irreversible, cranial and peripheral neuropathy. Neurologic damage appears after the renal phase, so a patient improving renally is not out of danger.","window":"","sources":[{"label":"WHO alerts on diethylene glycol-contaminated syrups","type":"Guideline"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-037-toxic-alcohols-when-fomepizole-is-unavailable","toxinId":"037-toxic-alcohols-when-fomepizole-is-unavailable","antidoteIds":["ethanol"],"tier":"B","agentLine":"Ethanol infusion","dose":"10% ethanol IV: load 8 mL/kg, maintain 1–2 mL/kg/h\nTarget serum ethanol 100–150 mg/dL; increase rate ~2× during dialysis","pitfall":"Requires hourly ethanol levels, causes sedation and hypoglycemia (especially in children), and adds a second CNS depressant to a patient who may need airway protection. It works, but it is a considerably more labour-intensive antidote.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-038-isopropanol-rubbing-alcohol","toxinId":"038-isopropanol-rubbing-alcohol","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Supportive; hemodialysis only for hypotension or extreme concentrations","pitfall":"Ketosis without acidosis is the classic pattern. Do not give fomepizole — blocking alcohol dehydrogenase prolongs the parent compound's sedative effect and the metabolite (acetone) is comparatively benign.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-039-cyanide-smoke-inhalation-hcn-nitroprusside-acetonitrile-apri","toxinId":"039-cyanide-smoke-inhalation-hcn-nitroprusside-acetonitrile-apri","antidoteIds":["hydroxocobalamin","thiosulfate"],"tier":"A","agentLine":"Hydroxocobalamin (Cyanokit)","dose":"5 g IV over 15 min; 10 g in cardiac arrest or persistent instability\nPediatric 70 mg/kg (max 5 g)\nAdjunct sodium thiosulfate 12.5 g IV through a separate line","pitfall":"This is the correction to the source graphic — hydroxocobalamin, not nitrite, is first line, particularly in fire victims where carbon monoxide co-exposure makes induced methemoglobinemia dangerous. Treat empirically on clinical suspicion; blood cyanide takes days. Lactate above 8 mmol/L in a fire victim is the practical trigger. The drug turns plasma, skin, and urine deep red and interferes with co-oximetry, chemistry panels, and some hemodialysis machines' blood-leak detectors.","window":"","sources":[{"label":"Cyanokit prescribing information","type":"FDA label"},{"label":"AHA 2023 focused update: cardiac arrest in toxicity","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-040-cyanide-alternative-when-hydroxocobalamin-is-unavailable","toxinId":"040-cyanide-alternative-when-hydroxocobalamin-is-unavailable","antidoteIds":["nitrite-thiosulfate"],"tier":"B","agentLine":"Sodium nitrite + sodium thiosulfate (Nithiodote)","dose":"Sodium nitrite 300 mg (10 mL of 3%) IV over 5–20 min\nSodium thiosulfate 12.5 g (50 mL of 25%) IV\nPediatric nitrite: 0.2 mL/kg of 3%, adjusted for hemoglobin","pitfall":"Note the name: sodium nitrITE. Sodium nitrate is a different, inactive compound and the confusion appears in circulating teaching material. Avoid nitrite in fire victims and anyone with possible carbon monoxide exposure — you are trading one oxygen-carrying deficit for another. Do not run nitrite and hydroxocobalamin through the same line.","window":"","sources":[{"label":"Nithiodote prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-041-carbon-monoxide","toxinId":"041-carbon-monoxide","antidoteIds":["oxygen"],"tier":"B","agentLine":"100% oxygen; hyperbaric oxygen in selected cases","dose":"Non-rebreather at 15 L/min or intubation with FiO₂ 1.0\nHBO for loss of consciousness, neurologic deficit, myocardial ischemia, pregnancy, or COHb >25% (>15–20% in pregnancy)","pitfall":"Pulse oximetry reads normal and is actively misleading — send a co-oximetry panel. COHb level correlates poorly with severity and with delayed neurologic sequelae, so a modest level in a symptomatic patient still warrants aggressive treatment. In pregnancy, fetal hemoglobin binds CO more avidly and clears more slowly: treat the fetus, not the maternal number.","window":"HBO benefit greatest within 6 h","sources":[{"label":"UHMS indications for hyperbaric oxygen therapy","type":"Guideline"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-042-hydrogen-sulfide-manure-pits-oil-and-gas-chemical-suicide","toxinId":"042-hydrogen-sulfide-manure-pits-oil-and-gas-chemical-suicide","antidoteIds":["oxygen"],"tier":"D","agentLine":"High-flow oxygen; sodium nitrite (contested)","dose":"Immediate removal and 100% oxygen\nSodium nitrite 300 mg IV — theoretical benefit, little clinical evidence\nHydroxocobalamin and cobinamide remain investigational","pitfall":"Scene safety is the treatment. Rescuers and clinicians have been killed by off-gassing from patients and from enclosed spaces; 'knockdown' at high concentrations is instantaneous. Most survivors recover with oxygen alone, so the antidote question is usually academic.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"},{"label":"HHS CHEMM","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-043-nitroprusside-associated-cyanide-accumulation","toxinId":"043-nitroprusside-associated-cyanide-accumulation","antidoteIds":["thiosulfate","hydroxocobalamin"],"tier":"C","agentLine":"Sodium thiosulfate co-infusion; hydroxocobalamin if toxic","dose":"Thiosulfate 10:1 by weight with nitroprusside as prophylaxis\nHydroxocobalamin 5 g if toxicity develops","pitfall":"Risk rises with infusion rates above 2 µg/kg/min, prolonged duration, and renal impairment. Rising mixed venous oxygen saturation with worsening acidosis on a stable infusion is the clue.","window":"","sources":[{"label":"Nitroprusside prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-044-chlorine-phosgene-ammonia-riot-control-agents","toxinId":"044-chlorine-phosgene-ammonia-riot-control-agents","antidoteIds":[],"tier":"N","agentLine":"None specific","dose":"Decontamination, humidified oxygen, bronchodilators\nPhosgene: observe 24 h for delayed pulmonary edema","pitfall":"Nebulized bicarbonate for chlorine is popular and poorly supported. Phosgene's latency is the danger — an asymptomatic patient at 4 hours can be in ARDS at 12.","window":"","sources":[{"label":"HHS CHEMM","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-045-organophosphate-insecticides-malathion-parathion-chlorpyrifo","toxinId":"045-organophosphate-insecticides-malathion-parathion-chlorpyrifo","antidoteIds":["atropine"],"tier":"A","agentLine":"Atropine — doubling protocol","dose":"1–3 mg IV, then DOUBLE the dose every 3–5 min until secretions dry\nInfusion at 10–20% of the total loading dose per hour\nCumulative doses of several hundred milligrams are routine","pitfall":"The endpoint is dried bronchial secretions and adequate oxygenation — not pupil size, not heart rate. Miosis persists long after adequate atropinization and chasing it causes toxicity; conversely, stopping atropine because the heart rate rose leaves the patient drowning in their own secretions. Decontaminate the patient and protect staff: dermal absorption from clothing has poisoned ED personnel.","window":"","sources":[{"label":"WHO guidance on pesticide poisoning management","type":"Guideline"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-046-organophosphate-nicotinic-effects-and-aging-prevention","toxinId":"046-organophosphate-nicotinic-effects-and-aging-prevention","antidoteIds":["pralidoxime"],"tier":"B","agentLine":"Pralidoxime (2-PAM)","dose":"30 mg/kg IV over 30 min (max 2 g), then 8–10 mg/kg/h infusion (max 650 mg/h)\nWHO regimen: 30 mg/kg load then 8 mg/kg/h\nContinue at least 24 h past the last atropine requirement","pitfall":"Must be given with atropine, never alone — oximes transiently worsen cholinergic effects. Its value depends on reaching the enzyme before irreversible aging, which varies enormously by compound. Efficacy in pesticide poisoning remains genuinely contested; efficacy in nerve agent exposure is not.","window":"","sources":[{"label":"WHO recommended pralidoxime regimen","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-047-nerve-agents-sarin-soman-tabun-vx-novichok-class","toxinId":"047-nerve-agents-sarin-soman-tabun-vx-novichok-class","antidoteIds":["atropine","pralidoxime","benzodiazepine"],"tier":"A","agentLine":"Atropine + pralidoxime + benzodiazepine","dose":"DuoDote / ATNAA autoinjector: atropine 2.1 mg + pralidoxime 600 mg IM; up to 3 in rapid succession\nSeizure prophylaxis: midazolam 10 mg IM, or diazepam 10 mg (CANA autoinjector)\nThen convert to IV atropine titration and a pralidoxime infusion","pitfall":"Soman ages within minutes — the oxime window closes almost immediately, so autoinjectors go in before anything else, through clothing if necessary. Give the benzodiazepine even without visible seizure activity; nerve-agent seizures progress to status and to permanent injury. Responder protection and decontamination come before patient care, not after.","window":"Oxime before aging — minutes for soman","sources":[{"label":"DuoDote prescribing information","type":"FDA label"},{"label":"HHS CHEMM nerve agent guidance","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-048-carbamate-insecticides-carbaryl-aldicarb-and-medicinal-carba","toxinId":"048-carbamate-insecticides-carbaryl-aldicarb-and-medicinal-carba","antidoteIds":["atropine"],"tier":"C","agentLine":"Atropine; pralidoxime usually unnecessary","dose":"Atropine as for organophosphates\nPralidoxime not routinely required — carbamylation reverses spontaneously in hours","pitfall":"Older teaching that pralidoxime is harmful in carbaryl poisoning is not well supported, and in a mixed or unknown exposure it is reasonable to give it. Clinically the two are indistinguishable at the bedside, so treat empirically.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-049-antimuscarinic-delirium-diphenhydramine-jimson-weed-atropine","toxinId":"049-antimuscarinic-delirium-diphenhydramine-jimson-weed-atropine","antidoteIds":["physostigmine"],"tier":"D","agentLine":"Physostigmine — imported only, no US-approved product","dose":"0.5–2 mg IV over at least 5 min; may repeat once at 10–15 min\nDuration 45–60 min — recurrence expected\nNo FDA-approved US product exists. The FDA temporary-importation route remains in force: Anticholium (Köhler Chemie, via Provepharm and Direct Success), unapproved, foreign labelling, no barcode. Confirm your pharmacy holds unexpired stock","pitfall":"Do not build a protocol around a drug you cannot obtain — confirm your pharmacy actually holds unexpired stock before relying on this entry, and treat rivastigmine as the working first choice. Where physostigmine is available, it remains contraindicated with a wide QRS or any suspicion of tricyclic co-ingestion, and atropine should be drawn up at the bedside before administration.","window":"","sources":[{"label":"FDA temporary importation notice, Anticholium","type":"FDA notice"},{"label":"ASHP drug shortage bulletin, physostigmine","type":"FDA notice"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-050-antimuscarinic-delirium-when-physostigmine-is-unavailable","toxinId":"050-antimuscarinic-delirium-when-physostigmine-is-unavailable","antidoteIds":["rivastigmine"],"tier":"C","agentLine":"Rivastigmine","dose":"Oral 6 mg once, then 3 mg q1h as needed (max 12 mg/24 h)\nTransdermal patch 9.5 mg (≤100 kg) or 13.3 mg (>100 kg); pediatric 4.6 mg","pitfall":"Slower in onset than physostigmine but far longer acting, which suits a delirium expected to run many hours. It needs an enteral route or intact skin, so it is not an option in a patient refusing everything — those patients get benzodiazepine sedation and supportive care instead.","window":"","sources":[{"label":"Rivastigmine for antimuscarinic delirium, Am J Emerg Med 2025","type":"Literature"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-051-methotrexate","toxinId":"051-methotrexate","antidoteIds":["leucovorin"],"tier":"A","agentLine":"Leucovorin (folinic acid) or levoleucovorin","dose":"Dose escalated to the measured methotrexate level; typically 15 mg/m² q6h, far higher for delayed clearance\nUrinary alkalinization to pH >7.0 and aggressive hydration","pitfall":"Folic acid is not a substitute — the block is at dihydrofolate reductase and only reduced folates bypass it. Delay is what causes the mucositis, marrow failure, and death; start on suspicion and adjust on levels.","window":"","sources":[{"label":"Leucovorin calcium prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-052-methotrexate-with-delayed-clearance-level-1-mol-l-with-renal","toxinId":"052-methotrexate-with-delayed-clearance-level-1-mol-l-with-renal","antidoteIds":["glucarpidase","leucovorin"],"tier":"A","agentLine":"Glucarpidase (Voraxaze)","dose":"50 units/kg IV over 5 min, single dose\nContinue leucovorin, but separate the two by at least 2 h","pitfall":"Leucovorin is a substrate for glucarpidase — giving them together destroys the rescue. Methotrexate immunoassays are unreliable for about 48 hours afterwards because they cross-react with the inactive metabolite; use chromatographic assay or clinical judgment.","window":"","sources":[{"label":"Voraxaze prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-053-fluorouracil-or-capecitabine-overdose-or-early-severe-toxici","toxinId":"053-fluorouracil-or-capecitabine-overdose-or-early-severe-toxici","antidoteIds":["uridine"],"tier":"A","agentLine":"Uridine triacetate (Vistogard)","dose":"Adults 10 g PO q6h × 20 doses; pediatric 6.2 g/m² (max 10 g) q6h × 20\nMay be given by NG or G-tube","pitfall":"Start within 96 hours of the overdose, ideally before symptoms. Waiting for mucositis and neutropenia to declare themselves forfeits the benefit — by then the injury is largely fixed.","window":"Within 96 h of the overdose","sources":[{"label":"Vistogard prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-054-ifosfamide-encephalopathy","toxinId":"054-ifosfamide-encephalopathy","antidoteIds":["methylene-blue"],"tier":"C","agentLine":"Methylene blue","dose":"50 mg IV q4–6h until symptoms resolve; also used prophylactically in prior episodes\nThiamine 100 mg IV is an adjunct","pitfall":"Rule out hyponatremia, hypoglycemia, and CNS metastasis first — the diagnosis is clinical and the differential is broad. Same G6PD and serotonergic cautions as any methylene blue use.","window":"","sources":[{"label":"Off-label; case series","type":"Literature"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-055-anthracycline-extravasation","toxinId":"055-anthracycline-extravasation","antidoteIds":["dexrazoxane"],"tier":"A","agentLine":"Dexrazoxane (Totect)","dose":"Day 1: 1000 mg/m² (max 2000 mg) · Day 2: 1000 mg/m² (max 2000 mg) · Day 3: 500 mg/m² (max 1000 mg)\nInfuse over 1–2 h; first dose within 6 h of extravasation; large vein away from the affected limb\nReduce dose 50% if CrCl <40 mL/min\nRemove any topical cooling 15 min before infusion\nTotect brand is discontinued; no currently marketed dexrazoxane carries the extravasation indication, so generic use is off-label","pitfall":"Cold packs and dexrazoxane are antagonistic — cooling reduces its efficacy. Dimethyl sulfoxide is the alternative regimen but must not be combined with dexrazoxane. Generic dexrazoxane sits on the shelf for anthracycline cardioprotection, and staff assume the extravasation indication came with it. It did not — the brand that carried it is gone.","window":"First dose within 6 h of extravasation","sources":[{"label":"Totect prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-056-vinca-alkaloid-or-hyperosmolar-extravasation","toxinId":"056-vinca-alkaloid-or-hyperosmolar-extravasation","antidoteIds":["hyaluronidase"],"tier":"C","agentLine":"Hyaluronidase + warm compresses","dose":"150 units subcutaneously in 1 mL, injected in 5 divided doses around the site\nWarm compress — the opposite of anthracycline management","pitfall":"Getting the temperature backwards makes the injury worse. Vinca and etoposide want warmth and dispersion; anthracyclines and mechlorethamine want cold and localization.","window":"As soon as extravasation is recognised","sources":[{"label":"Hylenex prescribing information","type":"FDA label"},{"label":"ONS extravasation management guidelines","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-057-vasopressor-extravasation-norepinephrine-dopamine-vasopressi","toxinId":"057-vasopressor-extravasation-norepinephrine-dopamine-vasopressi","antidoteIds":["phentolamine"],"tier":"B","agentLine":"Phentolamine","dose":"5–10 mg in 10 mL normal saline, infiltrated into and around the site within 12 h\nTopical nitroglycerin 2% ointment as an adjunct","pitfall":"Terbutaline infiltration is a reasonable second line. The window is short — blanching that has progressed to a dusky, demarcated area may already be irreversible.","window":"Within 12 h of extravasation","sources":[{"label":"Phentolamine mesylate prescribing information","type":"FDA label"},{"label":"ONS extravasation management guidelines","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-058-cisplatin-ototoxicity-in-pediatric-localized-solid-tumors","toxinId":"058-cisplatin-ototoxicity-in-pediatric-localized-solid-tumors","antidoteIds":["thiosulfate"],"tier":"B","agentLine":"Sodium thiosulfate (Pedmark)","dose":"Given 6 h after each cisplatin infusion, per weight-based label\nFDA-approved September 2022","pitfall":"Prophylactic, not a rescue. It is not indicated for metastatic disease because of theoretical tumour protection, and it is a different clinical use from the thiosulfate used in cyanide poisoning.","window":"","sources":[{"label":"Pedmark prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-059-cyclophosphamide-or-ifosfamide-hemorrhagic-cystitis","toxinId":"059-cyclophosphamide-or-ifosfamide-hemorrhagic-cystitis","antidoteIds":["mesna"],"tier":"A","agentLine":"Mesna","dose":"60–160% of the alkylator dose, divided before and after\nPaired with aggressive hydration and frequent voiding","pitfall":"Prophylaxis only — it does nothing for established hemorrhagic cystitis, which then requires continuous bladder irrigation and urology.","window":"","sources":[{"label":"Mesnex prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-060-immune-checkpoint-inhibitor-toxicity","toxinId":"060-immune-checkpoint-inhibitor-toxicity","antidoteIds":["corticosteroid"],"tier":"B","agentLine":"Corticosteroids, escalating to infliximab or mycophenolate","dose":"Prednisone 1–2 mg/kg/day for grade 3–4 events; infliximab 5 mg/kg if steroid-refractory at 48–72 h","pitfall":"Infliximab is contraindicated in checkpoint inhibitor hepatitis — use mycophenolate instead. Myocarditis carries the highest mortality and needs high-dose steroids immediately, not a trial of observation.","window":"","sources":[{"label":"ASCO immune-related adverse events guideline","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-061-sulfonylurea-induced-hypoglycemia-glipizide-glyburide-glimep","toxinId":"061-sulfonylurea-induced-hypoglycemia-glipizide-glyburide-glimep","antidoteIds":["octreotide","dextrose"],"tier":"B","agentLine":"Octreotide + dextrose","dose":"Octreotide 50–100 µg SC or IV q6h (pediatric 1 µg/kg)\nDextrose for acute correction, then D10 infusion\nObserve 12–24 h after the final octreotide dose","pitfall":"Dextrose alone is a trap: it triggers further insulin release and drives recurrent, deeper hypoglycemia. Octreotide breaks that cycle and is first-line, not rescue. Do not discharge from the ED — glyburide's effect outlasts any reasonable observation period, particularly in the elderly and in renal impairment.","window":"","sources":[{"label":"J Med Toxicol, octreotide for sulfonylurea hypoglycemia","type":"Literature"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-062-insulin-overdose","toxinId":"062-insulin-overdose","antidoteIds":["dextrose"],"tier":"N","agentLine":"None","dose":"D50 boluses, then D10 or D20 infusion via central access\nPotassium, magnesium, and phosphate replacement; hourly glucose\nExcision of a subcutaneous depot has been described in massive injection","pitfall":"Long-acting analog overdoses require dextrose for days, not hours. Hypokalemia from intracellular shift is often what actually harms the patient.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-063-valproate-hyperammonemic-encephalopathy-or-hepatotoxicity","toxinId":"063-valproate-hyperammonemic-encephalopathy-or-hepatotoxicity","antidoteIds":["levocarnitine","hemodialysis"],"tier":"C","agentLine":"Levocarnitine (L-carnitine)","dose":"100 mg/kg IV load (max 6 g) over 30 min, then 15 mg/kg IV q4h\nHemodialysis for level >850 mg/L, coma, or shock","pitfall":"Ammonia can be markedly elevated with entirely normal transaminases — do not require liver injury before making the diagnosis. Lactulose does nothing here; the mechanism is carnitine depletion and urea cycle inhibition.","window":"","sources":[{"label":"Carnitor prescribing information","type":"FDA label"},{"label":"EXTRIP Workgroup, valproic acid","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-064-isoniazid-induced-seizures","toxinId":"064-isoniazid-induced-seizures","antidoteIds":["pyridoxine"],"tier":"A","agentLine":"Pyridoxine (vitamin B₆)","dose":"1 g pyridoxine per gram of isoniazid ingested\nUnknown quantity: 70 mg/kg IV, up to 5 g\nGive over 5–10 min; repeat if seizures persist","pitfall":"Benzodiazepines alone will not stop these seizures — the defect is GABA synthesis, and only pyridoxine restores it. Most emergency departments stock a few hundred milligrams, nowhere near the five grams a real ingestion requires. Confirm your actual stock now, not during the resuscitation.","window":"","sources":[{"label":"Pyridoxine hydrochloride injection prescribing information","type":"FDA label"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-065-gyromitra-false-morel-and-hydrazine-related-agents","toxinId":"065-gyromitra-false-morel-and-hydrazine-related-agents","antidoteIds":["pyridoxine"],"tier":"C","agentLine":"Pyridoxine","dose":"25 mg/kg IV, may repeat to a maximum of 15–20 g/day","pitfall":"Same mechanism as isoniazid, same stocking problem. Monomethylhydrazine also causes hepatotoxicity and hemolysis, so the seizures are not the whole illness.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-066-massive-thyroid-hormone-ingestion","toxinId":"066-massive-thyroid-hormone-ingestion","antidoteIds":["cholestyramine"],"tier":"C","agentLine":"Beta-blockade + cholestyramine","dose":"Propranolol 1–3 mg IV or 20–40 mg PO for adrenergic symptoms\nCholestyramine 4 g PO QID to interrupt enterohepatic recirculation\nPropylthiouracil and corticosteroids only in true thyroid storm","pitfall":"Symptoms are delayed 2 to 7 days as T4 converts to T3 — a well child at 6 hours means nothing. Most pediatric levothyroxine exposures need only observation.","window":"","sources":[{"label":"ATA thyrotoxicosis management guideline","type":"Guideline"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-067-iron","toxinId":"067-iron","antidoteIds":["deferoxamine"],"tier":"A","agentLine":"Deferoxamine","dose":"15 mg/kg/h IV infusion — faster rates cause hypotension\nLabel ceiling 6 g/24 h; toxicology practice commonly exceeds it in severe poisoning\nIndications: serum iron >500 µg/dL, shock, acidosis, persistent vomiting, or radiopaque tablets on film\nStop when acidosis resolves and urine colour normalizes, typically <24 h","pitfall":"Activated charcoal does not bind iron — whole bowel irrigation is the decontamination method. Vin rosé urine is neither sensitive nor specific and should not be your endpoint. Infusions beyond 24 hours are linked to ARDS and to Yersinia enterocolitica sepsis. Iron levels drawn late are falsely reassuring as iron distributes into tissue.","window":"","sources":[{"label":"Desferal prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-068-lead-encephalopathy-or-blood-lead-70-g-dl","toxinId":"068-lead-encephalopathy-or-blood-lead-70-g-dl","antidoteIds":["bal","edta"],"tier":"B","agentLine":"Dimercaprol (BAL) first, then CaNa₂EDTA","dose":"BAL 4 mg/kg deep IM q4h — start FIRST\nCaNa₂EDTA 1500 mg/m²/day continuous infusion, beginning 4 h after BAL\nContinue 5 days, then reassess","pitfall":"Order matters: EDTA alone in encephalopathy redistributes lead into the brain and can kill. Never substitute disodium EDTA for calcium disodium EDTA — that error causes fatal hypocalcemia and has done so repeatedly. BAL is suspended in peanut oil, so document the allergy history.","window":"","sources":[{"label":"AAP lead exposure management guidance","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-069-lead-children-with-blood-lead-45-g-dl-no-encephalopathy","toxinId":"069-lead-children-with-blood-lead-45-g-dl-no-encephalopathy","antidoteIds":["succimer"],"tier":"A","agentLine":"Succimer (DMSA)","dose":"10 mg/kg PO q8h × 5 days, then 10 mg/kg q12h × 14 days\nThe only FDA-approved oral lead chelator; edetate calcium disodium and dimercaprol are the approved parenteral ones\nLabelled for children 1 year and older with blood lead above 45 µg/dL; at least 2 weeks between courses","pitfall":"Chelation without removing the exposure source is pointless and rebound is guaranteed — environmental abatement is part of the prescription. Chelation below 45 µg/dL has not improved neurodevelopmental outcomes and is not recommended. Succimer is the only oral option, not the only approved one — penicillamine is the agent with no lead indication at all. Forty-five is a guideline figure rather than a hard cut, and CDC's reference value of 3.5 µg/dL identifies exposure for follow-up; it is not a chelation threshold.","window":"","sources":[{"label":"Chemet prescribing information, rev. 9/2024","type":"FDA label"},{"label":"AAP, Treatment of Lead Poisoning, updated April 2025","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-070-arsenic-acute-inorganic-ingestion","toxinId":"070-arsenic-acute-inorganic-ingestion","antidoteIds":["bal","succimer","dmps"],"tier":"B","agentLine":"Dimercaprol, transitioning to succimer or DMPS","dose":"BAL 3–5 mg/kg IM q4h initially, then oral succimer 10 mg/kg q8h\nAggressive fluid resuscitation; monitor QT","pitfall":"Arsine gas is a completely different disease — massive hemolysis and renal failure — and chelation does not work; it needs exchange transfusion and dialysis. Do not treat the two the same way.","window":"","sources":[{"label":"Dimercaprol (BAL in Oil) prescribing information","type":"FDA label"},{"label":"ATSDR arsenic toxicity case studies","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-071-mercury-inorganic-salts-and-organic-methylmercury","toxinId":"071-mercury-inorganic-salts-and-organic-methylmercury","antidoteIds":["dmps","succimer"],"tier":"C","agentLine":"DMPS or succimer","dose":"Inorganic salts: DMPS is preferred where available; succimer 10 mg/kg q8h otherwise\nElemental vapor: supportive, chelation of limited value","pitfall":"Dimercaprol is contraindicated in methylmercury poisoning — it redistributes mercury into the central nervous system and worsens neurologic injury. This is the opposite of its role in inorganic mercury.","window":"","sources":[{"label":"ATSDR mercury toxicity case studies","type":"Guideline"},{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-072-copper-overload-and-wilson-disease","toxinId":"072-copper-overload-and-wilson-disease","antidoteIds":["penicillamine"],"tier":"B","agentLine":"Penicillamine, trientine, or zinc acetate","dose":"Penicillamine 250–500 mg PO QID; trientine 750–1500 mg/day\nZinc acetate 50 mg TID for maintenance","pitfall":"Penicillamine causes paradoxical neurologic worsening in a substantial minority of neurologic Wilson disease at initiation — trientine is the safer start. Acute copper sulfate ingestion causes hemolysis and hepatic necrosis and behaves like a different illness.","window":"","sources":[{"label":"AASLD Wilson disease practice guidance","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-073-thallium","toxinId":"073-thallium","antidoteIds":["prussian-blue"],"tier":"A","agentLine":"Prussian blue (ferric hexacyanoferrate, Radiogardase)","dose":"Adults and adolescents 3 g PO three times daily; children 2–12 y, 1 g three times daily\nContinue until urinary thallium falls; treatment often runs 30 days or more\nMulti-dose activated charcoal is a reasonable adjunct","pitfall":"Alopecia and painful ascending neuropathy appear late; by the time the hair falls out, the exposure is one to two weeks old. Hemodialysis is only useful very early.","window":"","sources":[{"label":"Radiogardase prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-074-radioactive-cesium-137-and-thallium-201-internal-contaminati","toxinId":"074-radioactive-cesium-137-and-thallium-201-internal-contaminati","antidoteIds":["prussian-blue"],"tier":"A","agentLine":"Prussian blue (Radiogardase)","dose":"Adults 3 g PO TID; children 2–12 y, 1 g TID\nContinue for 30 days or longer, guided by bioassay","pitfall":"Prussian blue does nothing for plutonium, americium, uranium, or iodine — matching the agent to the isotope is the whole exercise. Aquarium-grade or artist's pigment Prussian blue is not the pharmaceutical product.","window":"","sources":[{"label":"Radiogardase prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-075-transuranic-contamination-plutonium-239-americium-241-curium","toxinId":"075-transuranic-contamination-plutonium-239-americium-241-curium","antidoteIds":["dtpa"],"tier":"A","agentLine":"Ca-DTPA then Zn-DTPA","dose":"Ca-DTPA 1 g IV over 3–4 min or nebulized, within the first 24 h\nSwitch to Zn-DTPA 1 g daily for maintenance\nBoth NDAs are discontinued and the NDC is inactivated — obtain through Golden State Medical Supply, 1-805-477-9866, or REAC/TS","pitfall":"Ca-DTPA is more effective early but depletes essential trace metals with repeated use — the switch to Zn-DTPA at 24 hours is not optional. Avoid DTPA in uranium and neptunium contamination because of nephrotoxicity.","window":"","sources":[{"label":"Ca-DTPA and Zn-DTPA prescribing information","type":"FDA label"},{"label":"HHS REMM","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-23"},{"id":"p-076-radioiodine-i-131-exposure","toxinId":"076-radioiodine-i-131-exposure","antidoteIds":["ki"],"tier":"A","agentLine":"Potassium iodide (KI)","dose":"Adults and adolescents ≥70 kg: 130 mg PO once daily\nChildren 3–18 y: 65 mg · 1 month–3 y: 32 mg · neonates <1 month: 16 mg\nRepeat daily only while exposure risk persists\nGreatest benefit immediately before or within a few hours of exposure; efficacy falls steeply thereafter","pitfall":"KI blocks thyroid uptake of radioiodine and nothing else — it is useless for cesium, strontium, or any other isotope, and taking it 'for radiation' is a common public misconception. Contraindicated in iodine allergy and dermatitis herpetiformis.","window":"Greatest benefit before or within a few hours of exposure","sources":[{"label":"FDA KI guidance for radiation emergencies","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-077-hematopoietic-acute-radiation-syndrome","toxinId":"077-hematopoietic-acute-radiation-syndrome","antidoteIds":["csf"],"tier":"A","agentLine":"Filgrastim, pegfilgrastim, sargramostim, romiplostim","dose":"Filgrastim 10 µg/kg/day SC; pegfilgrastim 6 mg SC weekly × 2\nSargramostim 7 µg/kg/day; romiplostim 10 µg/kg SC × 1 (approved January 2021)\nStart as soon as exposure to a myelosuppressive dose is suspected","pitfall":"All were approved under the Animal Rule — dose from the label, not from oncology practice. Lymphocyte depletion kinetics in the first 48 hours are your best early dosimeter when physical dosimetry is unavailable.","window":"","sources":[{"label":"FDA MCM approvals under the Animal Rule","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-078-aluminum-and-zinc-phosphide-rodenticide-fumigant","toxinId":"078-aluminum-and-zinc-phosphide-rodenticide-fumigant","antidoteIds":[],"tier":"N","agentLine":"None","dose":"Supportive; extremely high mortality\nProtect staff — phosphine gas is released from gastric contents","pitfall":"Gastric lavage effluent and vomitus liberate phosphine. Health-care workers have been poisoned by treating these patients in enclosed spaces without ventilation.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-079-north-american-pit-vipers-rattlesnake-copperhead-cottonmouth","toxinId":"079-north-american-pit-vipers-rattlesnake-copperhead-cottonmouth","antidoteIds":["crofab"],"tier":"A","agentLine":"CroFab (ovine Fab) or Anavip (equine F(ab')₂)","dose":"CroFab: 4–6 vials to initial control, repeat until control, then 2 vials at 6, 12, and 18 h\nAnavip: 10 vials to initial control, then 4 vials as needed; maintenance rarely required\nBoth FDA-approved for all North American pit viper envenomation","pitfall":"CroFab's shorter half-life produces recurrent thrombocytopenia and coagulopathy days later, which is why the maintenance schedule exists and why patients need follow-up labs after discharge. Anavip's longer-lived F(ab')₂ largely avoids this. No tourniquets, no incision, no suction, no ice, no electricity — all of these add injury without removing venom.","window":"","sources":[{"label":"CroFab and Anavip prescribing information","type":"FDA label"},{"label":"Unified Treatment Algorithm, BMC Emerg Med 2011","type":"Consensus"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-080-coral-snake-micrurus-fulvius","toxinId":"080-coral-snake-micrurus-fulvius","antidoteIds":["coral-av"],"tier":"B","agentLine":"North American Coral Snake Antivenin (equine)","dose":"3–5 vials IV for a credible bite, repeat as needed\nSupply is limited; contact poison control early to locate stock","pitfall":"Neurotoxicity is delayed up to 12 hours and then progresses to respiratory failure. Treat on the basis of a credible bite; waiting for symptoms means intubating before the antivenom arrives. Local findings are minimal and falsely reassuring.","window":"Before neurotoxicity, which is delayed up to 12 h","sources":[{"label":"North American Coral Snake Antivenin prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-081-centruroides-scorpion-sting","toxinId":"081-centruroides-scorpion-sting","antidoteIds":["anascorp"],"tier":"A","agentLine":"Anascorp (equine F(ab')₂)","dose":"Initial dose 3 vials, diluted to 50 mL, IV over 10 min\nThen 1 vial at a time at 30–60 min intervals for persistent symptoms\nMonitor closely during and for 60 min after the infusion","pitfall":"Grade III–IV envenomation in small children — opsoclonus, roving eye movements, thrashing — is often mistaken for a seizure or dystonic reaction. Benzodiazepine sedation alone risks respiratory failure and a prolonged ICU stay that antivenom prevents.","window":"","sources":[{"label":"Anascorp prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-082-latrodectus-black-widow-envenomation","toxinId":"082-latrodectus-black-widow-envenomation","antidoteIds":["latrodectus-av"],"tier":"B","agentLine":"Antivenin Latrodectus mactans (equine whole IgG)","dose":"1 vial diluted in 50 mL saline over 30 min; repeat once if needed\nOpioids and benzodiazepines for pain and spasm","pitfall":"This is whole IgG, not a Fab fragment, so anaphylaxis and serum sickness rates are appreciably higher than with modern antivenoms. Reserve it for severe envenomation — refractory pain, hypertensive crisis, pregnancy with abdominal rigidity — rather than routine bites.","window":"","sources":[{"label":"Antivenin Latrodectus mactans prescribing information","type":"FDA label"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-083-loxosceles-brown-recluse","toxinId":"083-loxosceles-brown-recluse","antidoteIds":[],"tier":"N","agentLine":"No antivenom available in the US","dose":"Wound care, tetanus prophylaxis, observation\nMonitor for systemic loxoscelism: hemolysis, DIC, renal failure — mostly in children","pitfall":"Dapsone, steroids, and early excision are all popular and none are supported. Most necrotic wounds attributed to recluse spiders in areas outside their range are something else, usually MRSA.","window":"","sources":[{"label":"Goldfrank's Toxicologic Emergencies","type":"Textbook"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-084-stingray-scorpionfish-stonefish-lionfish","toxinId":"084-stingray-scorpionfish-stonefish-lionfish","antidoteIds":["hot-water"],"tier":"B","agentLine":"Hot water immersion; stonefish antivenom where stocked","dose":"Immerse in water at 42–45°C for 30–90 min — heat denatures the venom\nRadiograph for retained barb; these are heavily contaminated wounds","pitfall":"Test the water on the caregiver's own skin: analgesia from the venom means the patient cannot report a scald until it has happened. Retained spine fragments cause the delayed infections and are easily missed.","window":"","sources":[{"label":"Wilderness Medical Society practice guidelines, marine envenomation","type":"Guideline"}],"stockingTier":"","lastReviewed":"2026-08-02"},{"id":"p-085-botulism-adult-foodborne-wound-iatrogenic-age-1-y","toxinId":"085-botulism-adult-foodborne-wound-iatrogenic-age-1-y","antidoteIds":["bat"],"tier":"A","agentLine":"BAT heptavalent botulism antitoxin (equine, types A–G)","dose":"One vial IV, weight-adjusted in children\nObtained through the state health department and the CDC Emergency Operations Center: 770-488-7100","pitfall":"Antitoxin binds only circulating toxin — it halts progression but reverses nothing already bound at the nerve terminal. Every hour of diagnostic hesitation is permanent paralysis.
